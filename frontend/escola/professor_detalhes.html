<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Detalhes do Professor | GeoEduca</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <link href="../css/tokens.css" rel="stylesheet" />
  <link href="../css/sidebar.css" rel="stylesheet" />
  <style>
    :root {
      --background: oklch(0.16 0.045 275);
      --foreground: oklch(0.97 0.005 260);
      --card: oklch(0.21 0.048 274);
      --primary: oklch(0.82 0.14 88);
      --primary-foreground: oklch(0.17 0.045 275);
      --secondary: oklch(0.26 0.05 273);
      --muted-foreground: oklch(0.72 0.025 265);
      --border: oklch(1 0 0 / 12%);
      --font-display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
      --font-sans: "DM Sans", ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--background); color: var(--foreground); font-family: var(--font-sans); }
    .layout { display: flex; min-height: 100vh; }
    .main-content { flex: 1; margin-left: 260px; padding: 40px; }
    
    .back-link { display: inline-block; color: var(--primary); text-decoration: none; font-weight: 500; margin-bottom: 24px; }
    .back-link:hover { text-decoration: underline; }

    h1 { font-family: var(--font-display); font-size: 2rem; margin-bottom: 8px; }
    .subtitle { color: var(--muted-foreground); margin-bottom: 32px; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
    .stat-title { color: var(--muted-foreground); font-size: 0.875rem; margin-bottom: 8px; }
    .stat-value { font-family: var(--font-display); font-size: 2.5rem; font-weight: 700; color: var(--primary); }
    
    .section-title { font-family: var(--font-display); font-size: 1.5rem; margin-bottom: 16px; margin-top: 32px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    
    .list-container { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 32px;}
    .list-item { padding: 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .list-item:last-child { border-bottom: none; }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px); }
    .modal.active { display: flex; }
    .modal-content { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 100%; max-width: 480px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 0.875rem; color: var(--muted-foreground); margin-bottom: 6px; }
    .field input { width: 100%; padding: 10px 14px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 6px; color: var(--foreground); font-family: inherit; font-size: 0.9rem; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 20px; background: var(--primary); color: var(--primary-foreground); border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="layout">
    <!-- Sidebar -->
    <main class="main-content">
      <a href="professores.html" class="back-link">&larr; Voltar para Professores</a>
      
      <h1 id="prof-nome">Carregando...</h1>
      <p class="subtitle" id="prof-email">...</p>
      
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-title">Alunos</div>
          <div class="stat-value" id="stat-alunos">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">Provas</div>
          <div class="stat-value" id="stat-provas">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">Atividades/Quiz</div>
          <div class="stat-value" id="stat-atividades">-</div>
        </div>
      </div>
      
      <h2 class="section-title">Turmas/Salas</h2>
      <div class="list-container" id="list-salas">
        <div class="list-item" style="color:var(--muted-foreground)">Carregando salas...</div>
      </div>
      
    </main>
  </div>

  <!-- Modal Vincular/Alterar Gmail de Recuperação -->
  <div class="modal" id="modal-gmail">
    <div class="modal-content">
      <h2 style="font-family:var(--font-display); font-size:1.4rem; margin-bottom:8px;">Gmail de Recuperação</h2>
      <p style="font-size: 0.85rem; color: var(--muted-foreground); margin-bottom: 16px;">
        Defina ou atualize o endereço <strong>@gmail.com</strong> do professor para envio de códigos de recuperação e validação de acesso.
      </p>
      <form id="form-gmail" autocomplete="off">
        <div class="field">
          <label for="gmail-prof-input">Endereço Gmail (@gmail.com)</label>
          <input type="email" id="gmail-prof-input" placeholder="professor@gmail.com" required>
        </div>

        <div id="details-gmail-feedback" style="display:none; padding:10px 14px; border-radius:8px; font-size:0.85rem; margin-bottom:14px; line-height:1.4;"></div>

        <div style="display:flex;gap:12px;justify-content:flex-end">
          <button type="button" class="btn" style="background:transparent;border:1px solid var(--border);color:var(--foreground)" onclick="document.getElementById('modal-gmail').classList.remove('active')">Cancelar</button>
          <button type="submit" class="btn" id="btn-salvar-gmail">Salvar & Enviar Código</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/sidebar.js"></script>
  <script>
    function showFormFeedback(elId, message, isError = true) {
      const el = document.getElementById(elId);
      if (!el) return;
      el.style.display = 'flex';
      el.style.alignItems = 'center';
      el.style.gap = '8px';
      if (isError) {
        el.style.background = 'rgba(239, 68, 68, 0.12)';
        el.style.border = '1px solid rgba(239, 68, 68, 0.35)';
        el.style.color = '#ef4444';
        el.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> <span>${message}</span>`;
      } else {
        el.style.background = 'rgba(16, 185, 129, 0.12)';
        el.style.border = '1px solid rgba(16, 185, 129, 0.35)';
        el.style.color = '#10b981';
        el.innerHTML = `<i class="fa-solid fa-circle-check"></i> <span>${message}</span>`;
      }
    }

    function clearFormFeedback(elId) {
      const el = document.getElementById(elId);
      if (el) {
        el.style.display = 'none';
        el.innerHTML = '';
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (typeof Theme !== 'undefined' && Theme.init) Theme.init();
      const user = Auth.requireAuth('escola');
      if (!user) return;
      document.querySelector('.layout').insertAdjacentHTML('afterbegin', buildEscolaSidebar('../'));
      if (typeof Sidebar !== 'undefined' && Sidebar.init) Sidebar.init();
      
      const themeBtn = document.querySelector('[data-action="toggle-theme"]');
      if(themeBtn) themeBtn.addEventListener('click', () => Theme.toggle());
      const logoutBtn = document.querySelector('[data-action="logout"]');
      if(logoutBtn) logoutBtn.addEventListener('click', () => Auth.logout());

      const urlParams = new URLSearchParams(window.location.search);
      const profId = urlParams.get('id');

      if (!profId) {
        if (typeof Toast !== 'undefined') Toast.error('Atenção', 'ID do professor não fornecido');
        setTimeout(() => { window.location.href = 'professores.html'; }, 1000);
        return;
      }

      try {
        const data = await api.get('/escola/professores/' + profId);
        
        document.getElementById('prof-nome').textContent = data.nome;
        document.getElementById('prof-email').textContent = data.email;
        document.getElementById('stat-alunos').textContent = data.totalAlunos || 0;
        document.getElementById('stat-provas').textContent = data.totalProvas || 0;
        document.getElementById('stat-atividades').textContent = data.totalAtividades || 0;
        
        const gmailSpan = document.createElement('p');
        gmailSpan.style.cssText = 'color: var(--muted-foreground); font-size: 0.9rem; margin-top: -24px; margin-bottom: 24px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;';
        let currentGmail = data.emailRecuperacao || (data.email && data.email.endsWith('@gmail.com') ? data.email : '');
        gmailSpan.innerHTML = `
          <span>Gmail de Recuperação: <strong id="current-gmail-text" style="color:var(--foreground)">${currentGmail || 'Não vinculado'}</strong></span>
          <button class="btn" id="btn-edit-gmail" style="padding:4px 10px;font-size:0.75rem;background:var(--secondary);color:var(--foreground);border:1px solid var(--border);cursor:pointer;border-radius:6px;">
            ${currentGmail ? 'Alterar Gmail' : 'Vincular Gmail'}
          </button>
        `;
        document.getElementById('prof-email').after(gmailSpan);

        document.getElementById('btn-edit-gmail').addEventListener('click', () => {
          document.getElementById('gmail-prof-input').value = currentGmail || '';
          clearFormFeedback('details-gmail-feedback');
          document.getElementById('modal-gmail').classList.add('active');
        });

        document.getElementById('form-gmail').addEventListener('submit', async (e) => {
          e.preventDefault();
          const novo = document.getElementById('gmail-prof-input').value.trim();
          const btn = document.getElementById('btn-salvar-gmail');

          if (!/^[a-zA-Z0-9._%+-]+@gmail\.com$/i.test(novo)) {
            showFormFeedback('details-gmail-feedback', 'Por favor, informe um endereço válido @gmail.com', true);
            Toast.warning('Email inválido', 'Informe um endereço válido @gmail.com');
            return;
          }

          try {
            btn.disabled = true;
            btn.textContent = 'Salvando...';
            clearFormFeedback('details-gmail-feedback');

            const res = await api.put('/escola/professores/' + profId + '/email', { emailRecuperacao: novo });
            showFormFeedback('details-gmail-feedback', res.message || 'Gmail salvo com sucesso!', false);
            Toast.success('Gmail salvo', res.message || 'Gmail de recuperação salvo com sucesso!');
            currentGmail = novo;
            document.getElementById('current-gmail-text').textContent = novo;

            setTimeout(() => {
              document.getElementById('modal-gmail').classList.remove('active');
              clearFormFeedback('details-gmail-feedback');
            }, 800);
          } catch(err) {
            const msg = err.message || 'Erro ao salvar Gmail';
            showFormFeedback('details-gmail-feedback', msg, true);
            Toast.error('Erro ao salvar', msg);
          } finally {
            btn.disabled = false;
            btn.textContent = 'Salvar & Enviar Código';
          }
        });

        const salasList = document.getElementById('list-salas');
        if (data.salas && data.salas.length > 0) {
          salasList.innerHTML = data.salas.map(s => `
            <div class="list-item">
              <div>
                <strong style="color:var(--foreground)">${s.nome}</strong>
              </div>
              <div style="color:var(--muted-foreground)">
                ID: ${s.id}
              </div>
            </div>
          `).join('');
        } else {
          salasList.innerHTML = '<div class="list-item" style="color:var(--muted-foreground)">Nenhuma sala cadastrada por este professor.</div>';
        }
        
      } catch (err) {
        Toast.error('Erro ao carregar detalhes', err.message || 'Falha ao conectar com o servidor');
      }
    });
  </script>
</body>
</html>
