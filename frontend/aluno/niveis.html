<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoEduca - Meu Nível & Títulos</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23cca43b%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22></circle><line x1=%222%22 y1=%2212%22 x2=%2222%22 y2=%2212%22></line><path d=%22M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z%22></path></svg>" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/animations.css" />
    <link rel="stylesheet" href="../css/sidebar.css" />
    <link rel="stylesheet" href="../css/darkmode.css" />
    <style>
        .niveis-hero {
            background: linear-gradient(135deg, var(--navy) 0%, var(--primary) 100%);
            border-radius: 16px;
            padding: 3rem 2rem;
            color: white;
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
        }
        .niveis-hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('data:image/svg+xml;utf8,<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="20" r="2" fill="rgba(255,255,255,0.1)"/></svg>') repeat;
            opacity: 0.5;
        }
        .nivel-circulo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 4px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 800;
            margin: 0 auto 1.5rem auto;
            position: relative;
            z-index: 1;
            box-shadow: 0 0 30px rgba(204, 164, 59, 0.4);
        }
        .xp-bar-container {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        .xp-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.9);
        }
        .xp-bar-bg {
            height: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            overflow: hidden;
        }
        .xp-bar-fill {
            height: 100%;
            background: var(--gold);
            width: 0%;
            transition: width 1s ease-out;
        }

        .cosmeticos-section {
            margin-top: 3rem;
        }
        .cosmeticos-title {
            font-size: 1.5rem;
            color: var(--color-text-primary);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .cosmeticos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }
        .cosmetico-card {
            background: var(--surface-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            position: relative;
            transition: all 0.2s ease;
        }
        .cosmetico-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }
        .cosmetico-card.locked {
            opacity: 0.7;
            background: var(--surface-secondary);
        }
        .cosmetico-card.locked::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.05);
            border-radius: 12px;
            pointer-events: none;
        }
        .lock-icon {
            position: absolute;
            top: 1rem;
            right: 1rem;
            color: var(--color-text-muted);
        }
        .cosmetico-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }
        .borda-preview {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 1rem auto;
            background: var(--surface-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--color-text-muted);
            border: 4px solid transparent;
        }
        .req-nivel {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 1rem;
        }
        
    </style>
</head>
<body>
    <div class="app-layout" id="app-layout">
        <main class="app-main">
            <header class="page-header">
                <div class="page-header-left">
                    <h1 class="page-title">Meu Nível e Títulos</h1>
                    <p class="page-subtitle">Suba de nível e desbloqueie cosméticos exclusivos para o seu perfil!</p>
                </div>
                <div class="page-header-right">
                    <div class="user-profile" id="profile-btn" style="cursor:pointer;">
                        <div class="avatar" style="background:var(--navy);">
                            <span id="user-initial">A</span>
                        </div>
                    </div>
                </div>
            </header>

            <div class="page-content">
                <div class="niveis-hero">
                    <div class="nivel-circulo" id="hero-nivel">1</div>
                    <div class="xp-bar-container">
                        <div class="xp-text">
                            <span id="hero-xp-atual">0 XP</span>
                            <span id="hero-xp-prox">200 XP para o Nível 2</span>
                        </div>
                        <div class="xp-bar-bg">
                            <div class="xp-bar-fill" id="hero-xp-bar"></div>
                        </div>
                    </div>
                </div>

                <div class="cosmeticos-section">
                    <h2 class="cosmeticos-title"><i class="fa-solid fa-medal" style="color: var(--gold);"></i> Títulos Desbloqueáveis</h2>
                    <div class="cosmeticos-grid" id="grid-titulos">
                        <!-- Preenchido via JS -->
                    </div>
                </div>

                <div class="cosmeticos-section">
                    <h2 class="cosmeticos-title"><i class="fa-solid fa-circle-user" style="color: var(--primary);"></i> Bordas de Perfil</h2>
                    <div class="cosmeticos-grid" id="grid-bordas">
                        <!-- Preenchido via JS -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/sidebar.js"></script>
    <script src="../js/aluno/niveis.js"></script>
</body>
</html>
