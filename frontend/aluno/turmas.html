<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoEduca - Minhas Turmas</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23cca43b%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22></circle><line x1=%222%22 y1=%2212%22 x2=%2222%22 y2=%2212%22></line><path d=%22M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z%22></path></svg>" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/animations.css" />
    <link rel="stylesheet" href="../css/sidebar.css" />
    <link rel="stylesheet" href="../css/darkmode.css" />
    <style>
        .turmas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        .turma-card {
            background: var(--surface-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            transition: all 0.2s ease;
            text-decoration: none;
            color: inherit;
        }
        .turma-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            border-color: var(--navy);
        }
        .turma-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .turma-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(30, 58, 138, 0.1);
            color: var(--navy);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        .turma-info h3 {
            margin: 0;
            font-size: 1.25rem;
            color: var(--color-text-primary);
        }
        .turma-info p {
            margin: 0;
            font-size: 0.875rem;
            color: var(--color-text-muted);
        }
        .turma-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
        }
        .turma-meta span {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: var(--surface-primary);
            border-radius: 12px;
            border: 1px dashed var(--border-color);
            grid-column: 1 / -1;
        }
        .empty-state i {
            font-size: 3rem;
            color: var(--color-text-muted);
            margin-bottom: 1rem;
        }
        .empty-state h3 {
            margin-bottom: 0.5rem;
            color: var(--color-text-primary);
        }
        .empty-state p {
            color: var(--color-text-secondary);
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="app-layout" id="app-layout">
        <main class="app-main">
            <header class="page-header">
                <div class="page-header-left">
                    <h1 class="page-title">Minhas Turmas</h1>
                    <p class="page-subtitle">Gerencie suas turmas e acesse os conteúdos de cada uma</p>
                </div>
                <div class="page-header-right">
                    <button class="btn btn-primary" onclick="Modal.open('joinRoomModal')">
                        <i class="fa-solid fa-plus"></i> Entrar em Nova Turma
                    </button>
                    <div class="user-profile" id="profile-btn" style="cursor:pointer;">
                        <div class="avatar" style="background:var(--navy);">
                            <span id="user-initial">A</span>
                        </div>
                    </div>
                </div>
            </header>

            <div class="page-content">
                <div id="turmas-container" class="turmas-grid">
                    <!-- Turmas serão carregadas aqui -->
                    <div class="empty-state">
                        <i class="fa-solid fa-spinner fa-spin"></i>
                        <p>Carregando turmas...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Entrar em Turma -->
    <div id="joinRoomModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Entrar em uma Turma</h2>
                <button class="close-modal" onclick="Modal.close('joinRoomModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <form id="form-join-room">
                    <div class="form-group">
                        <label for="roomCode">Código da Turma (Ex: 1A, 3B, 9C)</label>
                        <input type="text" id="roomCode" class="form-control" placeholder="Digite o código fornecido pelo professor" required autocomplete="off" style="text-transform: uppercase;">
                    </div>
                    <div id="join-error" class="error-text" style="display: none; margin-bottom: 1rem;"></div>
                    <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                        <button type="button" class="btn btn-outline" style="flex: 1;" onclick="Modal.close('joinRoomModal')">Cancelar</button>
                        <button type="submit" class="btn btn-primary" style="flex: 1;" id="btn-submit-join">
                            <i class="fa-solid fa-right-to-bracket"></i> Entrar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/sidebar.js"></script>
    <script src="../js/aluno/turmas.js"></script>
</body>
</html>
