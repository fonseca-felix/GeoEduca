<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Memória dos Biomas — GeoEduca</title>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <!-- GeoEduca Core CSS -->
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/sidebar.css" />
  <link rel="stylesheet" href="../css/darkmode.css" />

  <style>
    .game-play-container {
      width: 100%;
      padding: 28px 32px;
      max-width: 800px;
      margin: 0 auto;
    }
    .game-card-body {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    .game-card-header {
      background: var(--navy);
      color: white;
      padding: 32px;
      text-align: center;
      position: relative;
    }
    .game-title {
      font-family: var(--font-display, 'Space Grotesk', sans-serif);
      font-size: 2rem;
      font-weight: 800;
      margin: 0 0 6px 0;
    }
    .game-meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: var(--color-bg);
      border-bottom: 1px solid var(--color-border);
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--color-text-secondary);
    }
    .game-content-panel {
      padding: 32px;
      text-align: center;
    }
    .memory-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      width: 100%;
      margin: 0 auto 16px;
    }
    .memory-card {
      height: 90px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      background: var(--navy);
      color: transparent;
      transition: all 0.3s;
      border: 2px solid var(--navy);
      text-align: center;
      padding: 8px;
      line-height: 1.3;
      user-select: none;
    }
    .memory-card.revealed {
      color: white;
    }
    .memory-card.matched {
      opacity: 0.6;
      cursor: default;
    }
    @media (max-width: 580px) {
      .memory-grid {
        grid-template-columns: repeat(3, 1fr);
      }
      .memory-card {
        height: 100px;
        font-size: 0.72rem;
      }
    }
  </style>
</head>
<body>

<div class="app-layout" id="app-layout">
  <!-- Sidebar injetada via JS -->

  <main class="app-main" style="padding: 0;">
    <header class="app-header" style="display:flex; align-items:center; justify-content:space-between; padding: 20px 28px 0;">
      <div style="display:flex; align-items:center; gap:12px;">
        <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Abrir menu">
          <i class="fas fa-bars"></i>
        </button>
        <div>
          <div style="font-size:0.65rem; font-weight:800; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-text-muted); margin-bottom:1px;">Jogos Geográficos</div>
          <h1 style="margin:0; font-size:1.2rem; font-weight:800; color:var(--color-text-primary); font-family:var(--font-display);">
            Memória dos Biomas
          </h1>
        </div>
      </div>
      <a href="jogos.html" style="display:inline-flex; align-items:center; gap:7px; font-size:0.78rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--color-text-muted); text-decoration:none; padding:8px 14px; border:1px solid var(--color-border); border-radius:100px; transition:all 0.18s;"
         onmouseover="this.style.borderColor='var(--navy)'; this.style.color='var(--navy)';"
         onmouseout="this.style.borderColor='var(--color-border)'; this.style.color='var(--color-text-muted)';">
        <i class="fa-solid fa-arrow-left"></i> Jogos
      </a>
    </header>

    <div class="game-play-container">
      <div class="game-card-body" id="game-body-card">
        <!-- HEADER DENTRO DO JOGO -->
        <div class="game-card-header">
          <div style="font-size: 2.2rem; color: var(--gold); margin-bottom: 6px;"><i class="fa-solid fa-brain"></i></div>
          <h2 class="game-title">MEMÓRIA DOS BIOMAS</h2>
          <p style="margin:0; opacity:0.75; font-size:0.85rem; font-weight:500;">ASSOCIE O NOME À CARACTERÍSTICA DO BIOMA</p>
        </div>

        <!-- PLACAR E PROGRESSO -->
        <div class="game-meta-bar">
          <span><i class="fa-solid fa-trophy" style="color:var(--gold);"></i> Pontos: <strong id="game-score" style="color:var(--navy)">0</strong></span>
          <span>Pares: <strong id="game-pairs" style="color:var(--color-success)">0</strong> / 6</span>
          <span>Meta: 40 pts</span>
        </div>

        <!-- ÁREA DE JOGO DINÂMICA -->
        <div class="game-content-panel" id="play-area">
          <!-- Carregado via JS -->
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Scripts GeoEduca -->
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/sidebar.js"></script>`n<script src="../js/aluno/character.js"></script>
<script src="../js/darkmode.js"></script>

<script>
  const biomasData = [
    {bioma:"Amazônia",      char:"Maior floresta tropical do mundo",       cor:"#059669"},
    {bioma:"Caatinga",      char:"Único bioma exclusivamente brasileiro",   cor:"#d97706"},
    {bioma:"Cerrado",       char:"Savana com maior biodiversidade do mundo",cor:"#854d0e"},
    {bioma:"Mata Atlântica",char:"Um dos biomas mais ameaçados do planeta", cor:"#16a34a"},
    {bioma:"Pampa",         char:"Campos do extremo sul com pecuária",      cor:"#4d7c0f"},
    {bioma:"Pantanal",      char:"Maior planície alagável do planeta",      cor:"#0891b2"}
  ];

  let currentScore = 0;
  let maxScore = 40;
  let foundPairs = 0;
  let selectedCards = [];
  let blockSelection = false;
  let secondsElapsed = 0;
  let timerInterval = null;

  function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

  function formatTime(s) {
    const m = Math.floor(s / 60).toString().padStart(2, '0');
    const sec = (s % 60).toString().padStart(2, '0');
    return `${m}:${sec}`;
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => { secondsElapsed++; }, 1000);
  }

  function renderMemoryGame() {
    const playArea = document.getElementById('play-area');
    const pairs = biomasData.map((b, i) => ([
      {id: i, texto: b.bioma,    cor: b.cor, tipo:'nome'},
      {id: i, texto: b.char,     cor: b.cor, tipo:'char'}
    ])).flat();
    const embaralhados = shuffle(pairs);

    playArea.innerHTML = `
      <p style="color:var(--color-text-secondary);font-size:0.95rem;margin:0 0 16px 0;font-weight:600;">Encontre as cartas correspondentes:</p>
      <div class="memory-grid" id="grid-container"></div>
      <div id="feedback-msg" style="font-weight:700;font-size:0.95rem;min-height:24px;margin-top:12px;"></div>
    `;

    const grid = document.getElementById('grid-container');
    embaralhados.forEach((c, idx) => {
      const card = document.createElement('div');
      card.className = 'memory-card';
      card.textContent = c.texto;
      card.onclick = () => {
        if (blockSelection || selectedCards.find(v => v.card === card) || card.classList.contains('matched')) return;
        
        card.style.background = c.tipo === 'nome' ? c.cor : '#475569';
        card.style.borderColor = c.cor;
        card.classList.add('revealed');
        selectedCards.push({card, id: c.id, cor: c.cor});

        if (selectedCards.length === 2) {
          blockSelection = true;
          const feedbackMsg = document.getElementById('feedback-msg');
          
          setTimeout(() => {
            if (selectedCards[0].id === selectedCards[1].id) {
              selectedCards.forEach(v => {
                v.card.style.background = v.cor;
                v.card.style.borderColor = v.cor;
                v.card.classList.add('matched');
              });
              foundPairs++;
              document.getElementById('game-pairs').textContent = foundPairs;
              currentScore += 10;
              document.getElementById('game-score').textContent = currentScore;

              feedbackMsg.style.color = 'var(--color-success)';
              feedbackMsg.innerHTML = `✓ Par encontrado! +10 pontos`;

              if (foundPairs >= 6) {
                setTimeout(finalizarJogo, 1000);
              }
            } else {
              selectedCards.forEach(v => {
                v.card.style.background = 'var(--navy)';
                v.card.style.borderColor = 'var(--navy)';
                v.card.classList.remove('revealed');
              });
              feedbackMsg.style.color = 'var(--color-danger)';
              feedbackMsg.innerHTML = `✗ Não é um par! Tente novamente.`;
            }
            selectedCards = [];
            blockSelection = false;
          }, 900);
        }
      };
      grid.appendChild(card);
    });
  }

  function finalizarJogo() {
    clearInterval(timerInterval);
    const playArea = document.getElementById('play-area');
    const tempo = formatTime(secondsElapsed);
    const pct = Math.min(100, Math.round((currentScore / maxScore) * 100));
    
    let estrelas = '';
    if (pct >= 85) estrelas = '<i class="fa-solid fa-star" style="color:var(--gold);"></i><i class="fa-solid fa-star" style="color:var(--gold);"></i><i class="fa-solid fa-star" style="color:var(--gold);"></i>';
    else if (pct >= 50) estrelas = '<i class="fa-solid fa-star" style="color:var(--gold);"></i><i class="fa-solid fa-star" style="color:var(--gold);"></i>';
    else estrelas = '<i class="fa-solid fa-star" style="color:var(--gold);"></i>';

    playArea.innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;gap:20px;padding:12px 0;">
        <div style="font-size:2.8rem;display:flex;gap:6px;">${estrelas}</div>
        <h2 style="color:var(--navy);font-family:var(--font-display);font-size:1.8rem;font-weight:900;margin:0;">Desafio Concluído!</h2>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:340px;margin-bottom:12px;">
          <div style="background:var(--color-bg);border:1px solid var(--color-border);border-radius:12px;padding:16px;text-align:center;">
            <div style="font-size:2rem;font-weight:900;color:var(--color-success)">${currentScore}</div>
            <div style="font-size:0.65rem;color:var(--color-text-muted);font-weight:700;text-transform:uppercase;letter-spacing:0.05em">Pontos</div>
          </div>
          <div style="background:var(--color-bg);border:1px solid var(--color-border);border-radius:12px;padding:16px;text-align:center;">
            <div style="font-size:2rem;font-weight:900;color:var(--navy)">${tempo}</div>
            <div style="font-size:0.65rem;color:var(--color-text-muted);font-weight:700;text-transform:uppercase;letter-spacing:0.05em">Tempo</div>
          </div>
        </div>
        <a href="jogos.html" class="btn btn-primary" style="padding:12px 32px;border-radius:100px;text-decoration:none;font-weight:700;display:inline-flex;align-items:center;gap:8px;">
          <i class="fa-solid fa-house"></i> Voltar ao Menu
        </a>
      </div>
    `;

    salvarResultado(currentScore, tempo, pct);
  }

  function salvarResultado(pontos, tempo, pct) {
    try {
      const hist = JSON.parse(localStorage.getItem('geoeduca_results') || '[]');
      const geoUser = JSON.parse(localStorage.getItem('geoeduca_user') || '{}');
      const nome = geoUser.name || localStorage.getItem('geoeduca_user_name') || 'Aluno';
      const sala = geoUser.sala || '';
      
      hist.push({
        gameId: 4,
        aluno: nome,
        sala: sala,
        pontuacao: pontos,
        tempo: tempo,
        data: new Date().toISOString(),
        pct: pct
      });
      localStorage.setItem('geoeduca_results', JSON.stringify(hist));
    } catch(e) {
      console.error(e);
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    const appLayout = document.getElementById('app-layout');
    if (appLayout && typeof buildAlunoSidebar === 'function') {
      appLayout.insertAdjacentHTML('afterbegin', buildAlunoSidebar('../'));
    }
    initPage('aluno');
    startTimer();
    renderMemoryGame();
  });
</script>

</body>
</html>
