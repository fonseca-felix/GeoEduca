<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Complete a Capital — GeoEduca</title>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <!-- GeoEduca Core CSS -->
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/sidebar.css" />
  <link rel="stylesheet" href="../css/darkmode.css" />

  <style>
    .game-play-container {
      width: 100%;
      padding: 28px 32px;
      max-width: 720px;
      margin: 0 auto;
    }
    .game-card-body {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    .game-card-header {
      background: var(--navy);
      color: white;
      padding: 32px;
      text-align: center;
      position: relative;
    }
    .game-title {
      font-family: var(--font-display, 'Space Grotesk', sans-serif);
      font-size: 2rem;
      font-weight: 800;
      margin: 0 0 6px 0;
    }
    .game-meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: var(--color-bg);
      border-bottom: 1px solid var(--color-border);
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--color-text-secondary);
    }
    .game-content-panel {
      padding: 32px;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="app-layout" id="app-layout">
  <!-- Sidebar injetada via JS -->

  <main class="app-main" style="padding: 0;">
    <header class="app-header" style="display:flex; align-items:center; justify-content:space-between; padding: 20px 28px 0;">
      <div style="display:flex; align-items:center; gap:12px;">
        <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Abrir menu">
          <i class="fas fa-bars"></i>
        </button>
        <div>
          <div style="font-size:0.65rem; font-weight:800; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-text-muted); margin-bottom:1px;">Jogos Geográficos</div>
          <h1 style="margin:0; font-size:1.2rem; font-weight:800; color:var(--color-text-primary); font-family:var(--font-display);">
            Complete a Capital
          </h1>
        </div>
      </div>
      <a href="jogos.html" style="display:inline-flex; align-items:center; gap:7px; font-size:0.78rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--color-text-muted); text-decoration:none; padding:8px 14px; border:1px solid var(--color-border); border-radius:100px; transition:all 0.18s;"
         onmouseover="this.style.borderColor='var(--navy)'; this.style.color='var(--navy)';"
         onmouseout="this.style.borderColor='var(--color-border)'; this.style.color='var(--color-text-muted)';">
        <i class="fa-solid fa-arrow-left"></i> Jogos
      </a>
    </header>

    <div class="game-play-container">
      <div class="game-card-body" id="game-body-card">
        <!-- HEADER DENTRO DO JOGO -->
        <div class="game-card-header" style="background:var(--navy);">
          <div style="font-size: 2.2rem; color: var(--gold); margin-bottom: 6px;"><i class="fa-solid fa-pen-nib"></i></div>
          <h2 class="game-title">COMPLETE A CAPITAL</h2>
          <p style="margin:0; opacity:0.75; font-size:0.85rem; font-weight:500;">DIGITE O NOME CORRETO DA CAPITAL</p>
        </div>

        <!-- PLACAR E PROGRESSO -->
        <div class="game-meta-bar">
          <span><i class="fa-solid fa-trophy" style="color:var(--gold);"></i> Pontos: <strong id="game-score" style="color:var(--navy)">0</strong></span>
          <span>Meta: 50 pts</span>
        </div>

        <!-- ÁREA DE JOGO DINÂMICA -->
        <div class="game-content-panel" id="play-area">
          <!-- Carregado via JS -->
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Scripts GeoEduca -->
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/sidebar.js"></script>`n<script src="../js/aluno/character.js"></script>
<script src="../js/darkmode.js"></script>

<script>
  const estadosBR = [
    {nome:"Acre",          sigla:"AC", capital:"Rio Branco",       regiao:"Norte",        icon:"<i class='fa-solid fa-tree'></i>"},
    {nome:"Alagoas",       sigla:"AL", capital:"Maceió",           regiao:"Nordeste",     icon:"<i class='fa-solid fa-umbrella-beach'></i>"},
    {nome:"Amapá",         sigla:"AP", capital:"Macapá",           regiao:"Norte",        icon:"<i class='fa-solid fa-leaf'></i>"},
    {nome:"Amazonas",      sigla:"AM", capital:"Manaus",           regiao:"Norte",        icon:"<i class='fa-solid fa-tree'></i>"},
    {nome:"Bahia",         sigla:"BA", capital:"Salvador",         regiao:"Nordeste",     icon:"<i class='fa-solid fa-drum'></i>"},
    {nome:"Ceará",         sigla:"CE", capital:"Fortaleza",        regiao:"Nordeste",     icon:"<i class='fa-solid fa-sun'></i>"},
    {nome:"Espírito Santo",sigla:"ES", capital:"Vitória",          regiao:"Sudeste",      icon:"<i class='fa-solid fa-mug-hot'></i>"},
    {nome:"Goiás",         sigla:"GO", capital:"Goiânia",          regiao:"Centro-Oeste", icon:"<i class='fa-solid fa-wheat-awn'></i>"},
    {nome:"Maranhão",      sigla:"MA", capital:"São Luís",         regiao:"Nordeste",     icon:"<i class='fa-solid fa-house-chimney'></i>"},
    {nome:"Mato Grosso",   sigla:"MT", capital:"Cuiabá",           regiao:"Centro-Oeste", icon:"<i class='fa-solid fa-fish'></i>"},
    {nome:"Mato Grosso do Sul",sigla:"MS",capital:"Campo Grande",  regiao:"Centro-Oeste", icon:"<i class='fa-solid fa-feather'></i>"},
    {nome:"Minas Gerais",  sigla:"MG", capital:"Belo Horizonte",   regiao:"Sudeste",      icon:"<i class='fa-solid fa-cheese'></i>"},
    {nome:"Pará",          sigla:"PA", capital:"Belém",            regiao:"Norte",        icon:"<i class='fa-solid fa-cloud-showers-heavy'></i>"},
    {nome:"Paraíba",       sigla:"PB", capital:"João Pessoa",      regiao:"Nordeste",     icon:"<i class='fa-solid fa-cloud-sun'></i>"},
    {nome:"Paraná",        sigla:"PR", capital:"Curitiba",         regiao:"Sul",          icon:"<i class='fa-solid fa-tree'></i>"},
    {nome:"Pernambuco",    sigla:"PE", capital:"Recife",           regiao:"Nordeste",     icon:"<i class='fa-solid fa-umbrella'></i>"},
    {nome:"Piauí",         sigla:"PI", capital:"Teresina",         regiao:"Nordeste",     icon:"<i class='fa-solid fa-sun'></i>"},
    {nome:"Rio de Janeiro",sigla:"RJ", capital:"Rio de Janeiro",   regiao:"Sudeste",      icon:"<i class='fa-solid fa-mountain'></i>"},
    {nome:"Rio Grande do Norte",sigla:"RN",capital:"Natal",        regiao:"Nordeste",     icon:"<i class='fa-solid fa-umbrella-beach'></i>"},
    {nome:"Rio Grande do Sul",sigla:"RS",capital:"Porto Alegre",   regiao:"Sul",          icon:"<i class='fa-solid fa-mug-hot'></i>"},
    {nome:"Rondônia",      sigla:"RO", capital:"Porto Velho",      regiao:"Norte",        icon:"<i class='fa-solid fa-train'></i>"},
    {nome:"Roraima",       sigla:"RR", capital:"Boa Vista",        regiao:"Norte",        icon:"<i class='fa-solid fa-mountain'></i>"},
    {nome:"Santa Catarina",sigla:"SC", capital:"Florianópolis",    regiao:"Sul",          icon:"<i class='fa-solid fa-apple-whole'></i>"},
    {nome:"São Paulo",     sigla:"SP", capital:"São Paulo",        regiao:"Sudeste",      icon:"<i class='fa-solid fa-city'></i>"},
    {nome:"Sergipe",       sigla:"SE", capital:"Aracaju",          regiao:"Nordeste",     icon:"<i class='fa-solid fa-water'></i>"},
    {nome:"Tocantins",     sigla:"TO", capital:"Palmas",           regiao:"Norte",        icon:"<i class='fa-solid fa-sun'></i>"},
    {nome:"Distrito Federal",sigla:"DF",capital:"Brasília",        regiao:"Centro-Oeste", icon:"<i class='fa-solid fa-building-columns'></i>"}
  ];

  let currentScore = 0;
  let maxScore = 270;
  let secondsElapsed = 0;
  let timerInterval = null;
  let currentTarget = null;
  let targetName = "";
  let hintAttempts = 1;
  let statesQueue = [];

  function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }
  function pickRandom(arr, n) { return shuffle(arr).slice(0, n); }

  function formatTime(s) {
    const m = Math.floor(s / 60).toString().padStart(2, '0');
    const sec = (s % 60).toString().padStart(2, '0');
    return `${m}:${sec}`;
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => { secondsElapsed++; }, 1000);
  }

  function renderGame() {
    if (statesQueue.length === 0) {
      finalizarJogo();
      return;
    }

    currentTarget = statesQueue[0];
    targetName = currentTarget.capital.toUpperCase();
    hintAttempts = 1;

    // Show ~30% of letters, hide rest with _
    const lacuna = targetName.split('').map(c => c === ' ' ? ' ' : (Math.random() > 0.70 ? c : '_')).join('');

    const playArea = document.getElementById('play-area');
    playArea.innerHTML = `
      <p style="color:var(--color-text-secondary);font-size:0.95rem;margin:0 0 16px 0;font-weight:600;">Complete o nome da capital do estado indicado (${28 - statesQueue.length} de 27).</p>
      <div style="background:linear-gradient(135deg,var(--navy),#1a1960);border-radius:16px;
        padding:20px 16px;margin-bottom:20px;color:white;text-align:center;box-shadow:inset 0 0 15px rgba(0,0,0,0.1)">
        <div style="font-size:13px;opacity:.7;margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.08em">Estado — Região ${currentTarget.regiao}</div>
        <div style="font-size:24px;font-weight:700;color:var(--gold);display:flex;align-items:center;justify-content:center;gap:8px;">${currentTarget.icon} ${currentTarget.nome} (${currentTarget.sigla})</div>
      </div>
      <div style="font-size:28px;font-family:monospace;font-weight:700;color:var(--gold);
        background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:12px;
        padding:18px;text-align:center;margin-bottom:20px;letter-spacing:10px;">${lacuna}</div>
      <div style="width:100%;max-width:360px;margin:0 auto 16px;">
        <input id="capital-input" type="text" class="form-control" placeholder="Digite a capital completa..."
          style="text-align:center;font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:2px;padding:12px 14px;border-radius:10px;"
          maxlength="30" autocomplete="off">
      </div>
      <div style="display:flex;gap:10px;max-width:360px;margin:0 auto 16px;width:100%;">
        <button class="btn btn-primary" style="flex:1;border-radius:100px;" onclick="verificarResposta()">Confirmar</button>
        <button class="btn btn-secondary" style="border-radius:100px;background:var(--color-bg);color:var(--color-text-primary);" id="dica-btn" onclick="obterDica()"><i class="fa-solid fa-lightbulb" style="color:var(--gold)"></i> Dica (1)</button>
        <button class="btn btn-secondary" style="border-radius:100px;background:var(--color-bg);color:var(--color-text-muted);" title="Pular pergunta" onclick="pularPergunta()"><i class="fa-solid fa-forward"></i></button>
      </div>
      <div id="feedback-msg" style="font-weight:700;font-size:0.95rem;min-height:24px;margin-top:12px;"></div>
    `;

    document.getElementById('capital-input').addEventListener('keydown', e => { if (e.key === 'Enter') verificarResposta(); });
    document.getElementById('capital-input').focus();
  }

  window.verificarResposta = () => {
    const val = document.getElementById('capital-input').value.trim().toUpperCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '');
    const ans = targetName.normalize('NFD').replace(/[̀-ͯ]/g, '');
    
    const feedbackMsg = document.getElementById('feedback-msg');

    if (val === ans) {
      currentScore += 10;
      document.getElementById('game-score').textContent = currentScore;
      feedbackMsg.style.color = 'var(--color-success)';
      feedbackMsg.innerHTML = '✓ Correto! +10 pontos';
      statesQueue.shift(); // Remove da lista
      setTimeout(renderGame, 1000);
    } else {
      feedbackMsg.style.color = 'var(--color-danger)';
      feedbackMsg.innerHTML = '✗ Incorreto! Tente novamente.';
    }
  };

  window.pularPergunta = () => {
    const feedbackMsg = document.getElementById('feedback-msg');
    feedbackMsg.style.color = 'var(--color-text-muted)';
    feedbackMsg.innerHTML = '⏭ Pulou... A resposta era: ' + targetName;
    
    const pulado = statesQueue.shift();
    // Reinsere no final
    statesQueue.push(pulado);
    
    // Trigger hint reaction to look like thinking/skip
    if (window.GeoCharacter) GeoCharacter.react('thinking');
    
    setTimeout(renderGame, 1500);
  };

  window.obterDica = () => {
    if (hintAttempts <= 0) return;
    hintAttempts--;
    const btn = document.getElementById('dica-btn');
    btn.innerHTML = `<i class="fa-solid fa-lightbulb"></i> Dica (0)`;
    btn.disabled = true;
    btn.style.opacity = '0.5';
    
    document.getElementById('capital-input').value = targetName.substring(0, Math.ceil(targetName.length / 2));
    
    const feedbackMsg = document.getElementById('feedback-msg');
    feedbackMsg.style.color = 'var(--gold)';
    feedbackMsg.innerHTML = `<i class="fa-solid fa-lightbulb"></i> A capital começa com: <strong>"${targetName.substring(0, 3)}"</strong>`;
    
    if (window.GeoCharacter) GeoCharacter.react('hint');
  };

  function finalizarJogo() {
    clearInterval(timerInterval);
    const playArea = document.getElementById('play-area');
    const tempo = formatTime(secondsElapsed);
    const pct = Math.min(100, Math.round((currentScore / maxScore) * 100));
    
    let estrelas = '';
    if (pct >= 85) estrelas = '<i class="fa-solid fa-star" style="color:var(--gold);"></i><i class="fa-solid fa-star" style="color:var(--gold);"></i><i class="fa-solid fa-star" style="color:var(--gold);"></i>';
    else if (pct >= 50) estrelas = '<i class="fa-solid fa-star" style="color:var(--gold);"></i><i class="fa-solid fa-star" style="color:var(--gold);"></i>';
    else estrelas = '<i class="fa-solid fa-star" style="color:var(--gold);"></i>';

    playArea.innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;gap:20px;padding:12px 0;">
        <div style="font-size:2.8rem;display:flex;gap:6px;">${estrelas}</div>
        <h2 style="color:var(--navy);font-family:var(--font-display);font-size:1.8rem;font-weight:900;margin:0;">Desafio Concluído!</h2>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:340px;margin-bottom:12px;">
          <div style="background:var(--color-bg);border:1px solid var(--color-border);border-radius:12px;padding:16px;text-align:center;">
            <div style="font-size:2rem;font-weight:900;color:var(--color-success)">${currentScore}</div>
            <div style="font-size:0.65rem;color:var(--color-text-muted);font-weight:700;text-transform:uppercase;letter-spacing:0.05em">Pontos</div>
          </div>
          <div style="background:var(--color-bg);border:1px solid var(--color-border);border-radius:12px;padding:16px;text-align:center;">
            <div style="font-size:2rem;font-weight:900;color:var(--navy)">${tempo}</div>
            <div style="font-size:0.65rem;color:var(--color-text-muted);font-weight:700;text-transform:uppercase;letter-spacing:0.05em">Tempo</div>
          </div>
        </div>
        <a href="jogos.html" class="btn btn-primary" style="padding:12px 32px;border-radius:100px;text-decoration:none;font-weight:700;display:inline-flex;align-items:center;gap:8px;">
          <i class="fa-solid fa-house"></i> Voltar ao Menu
        </a>
      </div>
    `;

    salvarResultado(currentScore, tempo, pct);
  }

  function salvarResultado(pontos, tempo, pct) {
    try {
      const hist = JSON.parse(localStorage.getItem('geoeduca_results') || '[]');
      const geoUser = JSON.parse(localStorage.getItem('geoeduca_user') || '{}');
      const nome = geoUser.name || localStorage.getItem('geoeduca_user_name') || 'Aluno';
      const sala = geoUser.sala || '';
      
      hist.push({
        gameId: 9,
        aluno: nome,
        sala: sala,
        pontuacao: pontos,
        tempo: tempo,
        data: new Date().toISOString(),
        pct: pct
      });
      localStorage.setItem('geoeduca_results', JSON.stringify(hist));
    } catch(e) {
      console.error(e);
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    const appLayout = document.getElementById('app-layout');
    if (appLayout && typeof buildAlunoSidebar === 'function') {
      appLayout.insertAdjacentHTML('afterbegin', buildAlunoSidebar('../'));
    }
    initPage('aluno');
    statesQueue = shuffle([...estadosBR]);
    startTimer();
    renderGame();
  });
</script>

</body>
</html>
