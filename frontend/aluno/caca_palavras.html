<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Caça-Palavras — GeoEduca</title>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <!-- GeoEduca Core CSS -->
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/sidebar.css" />
  <link rel="stylesheet" href="../css/darkmode.css" />

  <style>
    .game-play-container {
      width: 100%;
      padding: 28px 32px;
      max-width: 720px;
      margin: 0 auto;
    }
    .game-card-body {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    .game-card-header {
      background: var(--navy);
      color: white;
      padding: 32px;
      text-align: center;
      position: relative;
    }
    .game-title {
      font-family: var(--font-display, 'Space Grotesk', sans-serif);
      font-size: 2rem;
      font-weight: 800;
      margin: 0 0 6px 0;
    }
    .game-meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: var(--color-bg);
      border-bottom: 1px solid var(--color-border);
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--color-text-secondary);
    }
    .game-content-panel {
      padding: 24px 32px 32px;
      text-align: center;
    }
    .wordsearch-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 3px;
      width: 100%;
      max-width: 440px;
      margin: 0 auto 16px;
      font-family: 'Space Grotesk', monospace;
    }
    .word-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      border-radius: 6px;
      background: var(--color-surface-2);
      border: 1.5px solid var(--color-border);
      transition: all 0.15s;
      user-select: none;
    }
    .word-cell:hover:not(.found) {
      background: var(--color-border);
    }
    .word-cell.selected {
      background: rgba(204,164,59,0.3);
      border-color: var(--gold);
    }
    .word-cell.found {
      background: rgba(5,150,105,0.08);
      border-color: #059669;
      color: #059669;
      cursor: default;
    }
  </style>
</head>
<body>

<div class="app-layout" id="app-layout">
  <!-- Sidebar injetada via JS -->

  <main class="app-main" style="padding: 0;">
    <header class="app-header" style="display:flex; align-items:center; justify-content:space-between; padding: 20px 28px 0;">
      <div style="display:flex; align-items:center; gap:12px;">
        <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Abrir menu">
          <i class="fas fa-bars"></i>
        </button>
        <div>
          <div style="font-size:0.65rem; font-weight:800; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-text-muted); margin-bottom:1px;">Jogos Geográficos</div>
          <h1 style="margin:0; font-size:1.2rem; font-weight:800; color:var(--color-text-primary); font-family:var(--font-display);">
            Caça-Palavras
          </h1>
        </div>
      </div>
      <a href="jogos.html" style="display:inline-flex; align-items:center; gap:7px; font-size:0.78rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--color-text-muted); text-decoration:none; padding:8px 14px; border:1px solid var(--color-border); border-radius:100px; transition:all 0.18s;"
         onmouseover="this.style.borderColor='var(--navy)'; this.style.color='var(--navy)';"
         onmouseout="this.style.borderColor='var(--color-border)'; this.style.color='var(--color-text-muted)';">
        <i class="fa-solid fa-arrow-left"></i> Jogos
      </a>
    </header>

    <div class="game-play-container">
      <div class="game-card-body" id="game-body-card">
        <!-- HEADER DENTRO DO JOGO -->
        <div class="game-card-header" style="background:var(--navy);">
          <div style="font-size: 2.2rem; color: var(--gold); margin-bottom: 6px;"><i class="fa-solid fa-magnifying-glass"></i></div>
          <h2 class="game-title">CAÇA-PALAVRAS</h2>
          <p style="margin:0; opacity:0.75; font-size:0.85rem; font-weight:500;">ENCONTRE CAPITAIS E ESTADOS DO BRASIL</p>
        </div>

        <!-- PLACAR E PROGRESSO -->
        <div class="game-meta-bar">
          <span><i class="fa-solid fa-trophy" style="color:var(--gold);"></i> Pontos: <strong id="game-score" style="color:var(--navy)">0</strong></span>
          <span>Faltam: <strong id="game-left" style="color:var(--color-success)">5</strong> restantes</span>
          <span>Meta: 50 pts</span>
        </div>

        <!-- ÁREA DE JOGO DINÂMICA -->
        <div class="game-content-panel" id="play-area">
          <!-- Carregado via JS -->
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Scripts GeoEduca -->
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/darkmode.js"></script>

<script>
  const j8Palavras = ["ACRE","BELEM","NATAL","GOIAS","CEARA","PARANA","RECIFE","MANAUS","SALVADOR","BRASILIA"];

  let currentScore = 0;
  let maxScore = 50;
  let remainingWords = 5;
  let secondsElapsed = 0;
  let timerInterval = null;
  let selectedCells = [];
  let palavrasUsadas = [];

  function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }
  function pickRandom(arr, n) { return shuffle(arr).slice(0, n); }

  function formatTime(s) {
    const m = Math.floor(s / 60).toString().padStart(2, '0');
    const sec = (s % 60).toString().padStart(2, '0');
    return `${m}:${sec}`;
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => { secondsElapsed++; }, 1000);
  }

  function renderWordSearch() {
    palavrasUsadas = pickRandom(j8Palavras, 5);
    remainingWords = palavrasUsadas.length;
    document.getElementById('game-left').textContent = remainingWords;

    let gradeData = [];
    const chars = "ABCDEFGHIJKLMNOPRSTUVWXYZ";
    for (let i = 0; i < 100; i++) {
      gradeData.push(chars[Math.floor(Math.random() * chars.length)]);
    }

    palavrasUsadas.forEach((p, pi) => {
      const row = pi * 2;
      const maxCol = 10 - p.length;
      const col = Math.floor(Math.random() * (maxCol + 1));
      for (let i = 0; i < p.length; i++) {
        gradeData[row * 10 + col + i] = p[i];
      }
    });

    const playArea = document.getElementById('play-area');
    playArea.innerHTML = `
      <p style="color:var(--color-text-secondary);font-size:0.9rem;margin:0 0 16px 0;font-weight:600;line-height:1.5;">
        Clique nas letras em sequência para encontrar: <br>
        <span style="color:var(--gold);font-weight:800;font-size:1.05rem;">${palavrasUsadas.join(', ')}</span>
      </p>
      <div class="wordsearch-grid" id="grid-container"></div>
      <div id="feedback-msg" style="font-weight:700;font-size:0.95rem;min-height:24px;margin-top:12px;"></div>
    `;

    const grid = document.getElementById('grid-container');
    gradeData.forEach((l, i) => {
      const cell = document.createElement('div');
      cell.className = 'word-cell';
      cell.textContent = l;
      cell.dataset.idx = i;
      cell.dataset.letra = l;

      cell.onclick = () => {
        if (cell.classList.contains('found')) return;

        cell.classList.add('selected');
        selectedCells.push(cell);
        
        const formada = selectedCells.map(s => s.dataset.letra).join('');
        const feedbackMsg = document.getElementById('feedback-msg');

        if (palavrasUsadas.includes(formada)) {
          selectedCells.forEach(s => {
            s.classList.remove('selected');
            s.classList.add('found');
          });
          selectedCells = [];
          remainingWords--;
          document.getElementById('game-left').textContent = remainingWords;
          currentScore += 10;
          document.getElementById('game-score').textContent = currentScore;

          feedbackMsg.style.color = 'var(--color-success)';
          feedbackMsg.innerHTML = `✓ "${formada}" encontrado! +10 pontos`;

          if (remainingWords === 0 || currentScore >= maxScore) {
            setTimeout(finalizarJogo, 1000);
          }
        } else if (!palavrasUsadas.some(p => p.startsWith(formada))) {
          selectedCells.forEach(s => {
            s.classList.remove('selected');
          });
          selectedCells = [];
          feedbackMsg.style.color = 'var(--color-danger)';
          feedbackMsg.innerHTML = `✗ Sequência inválida. Tente novamente.`;
        }
      };

      grid.appendChild(cell);
    });
  }

  function finalizarJogo() {
    clearInterval(timerInterval);
    const playArea = document.getElementById('play-area');
    const tempo = formatTime(secondsElapsed);
    const pct = Math.min(100, Math.round((currentScore / maxScore) * 100));
    
    let estrelas = '';
    if (pct >= 85) estrelas = '<i class="fa-solid fa-star" style="color:var(--gold);"></i><i class="fa-solid fa-star" style="color:var(--gold);"></i><i class="fa-solid fa-star" style="color:var(--gold);"></i>';
    else if (pct >= 50) estrelas = '<i class="fa-solid fa-star" style="color:var(--gold);"></i><i class="fa-solid fa-star" style="color:var(--gold);"></i>';
    else estrelas = '<i class="fa-solid fa-star" style="color:var(--gold);"></i>';

    playArea.innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;gap:20px;padding:12px 0;">
        <div style="font-size:2.8rem;display:flex;gap:6px;">${estrelas}</div>
        <h2 style="color:var(--navy);font-family:var(--font-display);font-size:1.8rem;font-weight:900;margin:0;">Desafio Concluído!</h2>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:340px;margin-bottom:12px;">
          <div style="background:var(--color-bg);border:1px solid var(--color-border);border-radius:12px;padding:16px;text-align:center;">
            <div style="font-size:2rem;font-weight:900;color:var(--color-success)">${currentScore}</div>
            <div style="font-size:0.65rem;color:var(--color-text-muted);font-weight:700;text-transform:uppercase;letter-spacing:0.05em">Pontos</div>
          </div>
          <div style="background:var(--color-bg);border:1px solid var(--color-border);border-radius:12px;padding:16px;text-align:center;">
            <div style="font-size:2rem;font-weight:900;color:var(--navy)">${tempo}</div>
            <div style="font-size:0.65rem;color:var(--color-text-muted);font-weight:700;text-transform:uppercase;letter-spacing:0.05em">Tempo</div>
          </div>
        </div>
        <a href="jogos.html" class="btn btn-primary" style="padding:12px 32px;border-radius:100px;text-decoration:none;font-weight:700;display:inline-flex;align-items:center;gap:8px;">
          <i class="fa-solid fa-house"></i> Voltar ao Menu
        </a>
      </div>
    `;

    salvarResultado(currentScore, tempo, pct);
  }

  function salvarResultado(pontos, tempo, pct) {
    try {
      const hist = JSON.parse(localStorage.getItem('geoeduca_results') || '[]');
      const geoUser = JSON.parse(localStorage.getItem('geoeduca_user') || '{}');
      const nome = geoUser.name || localStorage.getItem('geoeduca_user_name') || 'Aluno';
      const sala = geoUser.sala || '';
      
      hist.push({
        gameId: 8,
        aluno: nome,
        sala: sala,
        pontuacao: pontos,
        tempo: tempo,
        data: new Date().toISOString(),
        pct: pct
      });
      localStorage.setItem('geoeduca_results', JSON.stringify(hist));
    } catch(e) {
      console.error(e);
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    const appLayout = document.getElementById('app-layout');
    if (appLayout && typeof buildAlunoSidebar === 'function') {
      appLayout.insertAdjacentHTML('afterbegin', buildAlunoSidebar('../'));
    }
    initPage('aluno');
    startTimer();
    renderWordSearch();
  });
</script>

</body>
</html>
