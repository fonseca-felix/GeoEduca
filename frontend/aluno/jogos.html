<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23cca43b%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22></circle><line x1=%222%22 y1=%2212%22 x2=%2222%22 y2=%2212%22></line><path d=%22M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z%22></path></svg>" />

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoEduca - Jogos Educativos</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/sidebar.css" />
  <link rel="stylesheet" href="../css/darkmode.css" />
  <style>
    .page-wrapper { display: grid; grid-template-columns: 1fr 300px; gap: 2rem; align-items: start; }
    @media (max-width: 1024px) {
      .page-wrapper { grid-template-columns: 1fr; }
    }

    .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }

    .game-card {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--color-border);
      display: flex; flex-direction: column;
      transition: transform 0.3s var(--transition-spring), box-shadow 0.3s, border-color 0.2s;
      cursor: pointer;
    }
    .game-card:hover {
      transform: translateY(-6px) scale(1.01);
      box-shadow: var(--shadow-lg);
      border-color: var(--gold);
    }
    .game-card:focus { outline: 2px solid var(--gold); outline-offset: 2px; }

    .game-thumb {
      height: 160px;
      position: relative;
      overflow: hidden;
    }
    .game-thumb-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.65) 0%, transparent 60%);
      display: flex; align-items: flex-end; padding: 1rem;
    }
    .game-category {
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(6px);
      color: white;
      padding: 0.25rem 0.75rem;
      border-radius: var(--radius-full);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border: 1px solid rgba(255,255,255,0.25);
    }

    .game-info { padding: 1.25rem 1.5rem 1.5rem; flex-grow: 1; display: flex; flex-direction: column; gap: 0.5rem; }
    .game-title {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--color-text-primary);
      margin: 0;
      letter-spacing: -0.01em;
    }
    .game-desc {
      font-size: 0.8rem;
      color: var(--color-text-secondary);
      line-height: 1.55;
      flex-grow: 1;
      margin: 0;
    }
    .game-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem; }
    .play-btn {
      background: var(--navy);
      color: white;
      border: none;
      width: 38px; height: 38px;
      border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
      flex-shrink: 0;
    }
    .game-card:hover .play-btn {
      background: var(--gold);
      transform: scale(1.12);
      box-shadow: var(--shadow-gold);
    }
    .play-btn svg { width: 18px; height: 18px; fill: white; margin-left: 2px; }

    /* Character Sidebar */
    .character-panel {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border);
      padding: 1.5rem;
      position: sticky;
      top: 2rem;
      box-shadow: var(--shadow-sm);
    }
    .character-title {
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 700;
      color: var(--color-text-primary);
      margin-bottom: 0.5rem;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .character-desc {
      font-size: 0.8rem;
      color: var(--color-text-secondary);
      margin-bottom: 1.25rem;
      line-height: 1.4;
    }
    .character-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .char-option {
      background: var(--color-surface-2);
      border: 2px solid transparent;
      border-radius: var(--radius-md);
      padding: 0.5rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.2s;
    }
    .char-option img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }
    .char-option span {
      font-size: 0.65rem;
      font-weight: 600;
      margin-top: 0.25rem;
      color: var(--color-text-muted);
      text-transform: capitalize;
    }
    .char-option:hover {
      background: rgba(204, 164, 59, 0.1);
    }
    .char-option.selected {
      border-color: var(--gold);
      background: rgba(204, 164, 59, 0.15);
    }
    .char-option.selected span {
      color: var(--gold);
    }
    .character-preview {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--color-surface-2);
      padding: 1rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border);
    }
    .character-preview img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
      animation: floatChar 3s ease-in-out infinite;
    }
    @keyframes floatChar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .char-speech {
      font-size: 0.75rem;
      color: var(--color-text-primary);
      background: var(--color-surface);
      padding: 0.75rem;
      border-radius: 12px;
      border-top-left-radius: 0;
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-sm);
      flex: 1;
      font-weight: 500;
      line-height: 1.4;
    }
  </style>
</head>
<body>
<div class="app-layout" id="app-layout">
  <main class="app-main">
    <header class="page-header">
      <div class="page-header-left">
        <h1 class="page-title">Jogos Educativos</h1>
        <p class="page-subtitle">Aprenda brincando e suba no ranking da turma!</p>
      </div>
    </header>
    <div class="page-content">
      
      <div class="page-wrapper">
        <!-- Games Section -->
        <div>
          <div class="games-grid" id="games-grid">
            <!-- Injected via JS -->
          </div>
        </div>

        <!-- Character Section -->
        <aside class="character-panel">
          <h3 class="character-title">
            <i class="fa-solid fa-user-astronaut"></i> Seu Ajudante
          </h3>
          <p class="character-desc">Escolha um personagem para te acompanhar e dar dicas durante os jogos!</p>
          <div class="character-grid" id="character-grid">
            <!-- Injected via JS -->
          </div>
          <div id="character-preview" class="character-preview" style="display:none;">
            <img id="char-img" src="" alt="Personagem" />
            <div id="char-speech" class="char-speech">Estou pronto para a aventura! Vamos nessa!</div>
          </div>
        </aside>
      </div>

    </div>
  </main>
</div>

<!-- Modal / Toast logic handled by JS directly via Toast.success for games usually -->

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/aluno/character.js"></script>
<script src="../js/aluno/jogos.js?v=3"></script>
<script src="../js/aluno/push.js"></script>
</body>
</html>
