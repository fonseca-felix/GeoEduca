<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23cca43b%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22></circle><line x1=%222%22 y1=%2212%22 x2=%2222%22 y2=%2212%22></line><path d=%22M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z%22></path></svg>" />

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Hidrografias — GeoEduca</title>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <!-- GeoEduca Core CSS -->
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/sidebar.css" />
  <link rel="stylesheet" href="../css/darkmode.css" />

  <style>
    .game-play-container {
      width: 100%;
      padding: 28px 32px;
      max-width: 720px;
      margin: 0 auto;
    }
    .game-card-body {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    .game-card-header {
      background: var(--navy);
      color: white;
      padding: 32px;
      text-align: center;
      position: relative;
    }
    .game-title {
      font-family: var(--font-display, 'Space Grotesk', sans-serif);
      font-size: 2rem;
      font-weight: 800;
      margin: 0 0 6px 0;
    }
    .game-meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: var(--color-bg);
      border-bottom: 1px solid var(--color-border);
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--color-text-secondary);
    }
    .game-content-panel {
      padding: 32px;
      text-align: center;
    }
    .btn-alt {
      background: var(--color-surface);
      border: 1.5px solid var(--color-border);
      border-radius: 12px;
      padding: 16px;
      font-family: var(--font-display, 'Space Grotesk', sans-serif);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      color: var(--color-text-primary);
      transition: all 0.18s;
      text-align: left;
    }
    .btn-alt:hover {
      border-color: var(--navy);
      background: var(--color-bg);
      transform: translateY(-2px);
    }
    .btn-alt.correct {
      background: rgba(5,150,105,0.08);
      border-color: #059669;
      color: #059669;
    }
    .btn-alt.wrong {
      background: rgba(220,38,38,0.08);
      border-color: #dc2626;
      color: #dc2626;
    }
    .btn-alt:disabled {
      opacity: 0.6;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div class="app-layout" id="app-layout">
  <!-- Sidebar injetada via JS -->

  <main class="app-main" style="padding: 0;">
    <header class="app-header" style="display:flex; align-items:center; justify-content:space-between; padding: 20px 28px 0;">
      <div style="display:flex; align-items:center; gap:12px;">
        <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Abrir menu">
          <i class="fas fa-bars"></i>
        </button>
        <div>
          <div style="font-size:0.65rem; font-weight:800; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-text-muted); margin-bottom:1px;">Jogos Geográficos</div>
          <h1 style="margin:0; font-size:1.2rem; font-weight:800; color:var(--color-text-primary); font-family:var(--font-display);">
            Hidrografias
          </h1>
        </div>
      </div>
      <a href="jogos.html" style="display:inline-flex; align-items:center; gap:7px; font-size:0.78rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--color-text-muted); text-decoration:none; padding:8px 14px; border:1px solid var(--color-border); border-radius:100px; transition:all 0.18s;"
         onmouseover="this.style.borderColor='var(--navy)'; this.style.color='var(--navy)';"
         onmouseout="this.style.borderColor='var(--color-border)'; this.style.color='var(--color-text-muted)';">
        <i class="fa-solid fa-arrow-left"></i> Jogos
      </a>
    </header>

    <div class="game-play-container">
      <div class="game-card-body" id="game-body-card">
        <!-- HEADER DENTRO DO JOGO -->
        <div class="game-card-header" style="background:var(--navy);">
          <div style="font-size: 2.2rem; color: var(--gold); margin-bottom: 6px;"><i class="fa-solid fa-water"></i></div>
          <h2 class="game-title">RIOS DO BRASIL</h2>
          <p style="margin:0; opacity:0.75; font-size:0.85rem; font-weight:500;">IDENTIFIQUE OS PRINCIPAIS RIOS PELAS CARACTERÍSTICAS</p>
        </div>

        <!-- PLACAR E PROGRESSO -->
        <div class="game-meta-bar">
          <span><i class="fa-solid fa-trophy" style="color:var(--gold);"></i> Pontos: <strong id="game-score" style="color:var(--navy)">0</strong></span>
          <span>Meta: 50 pts</span>
        </div>

        <!-- ÁREA DE JOGO DINÂMICA -->
        <div class="game-content-panel" id="play-area">
          <!-- Carregado via JS -->
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Scripts GeoEduca -->
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/sidebar.js"></script>`n<script src="../js/aluno/character.js"></script>
<script src="../js/darkmode.js"></script>

<script>
  const riosData = [
    {nome:"Rio Amazonas",      ext:"6.992 km", info:"O mais caudaloso do mundo"},
    {nome:"Rio São Francisco",  ext:"2.863 km", info:"'Rio da integração nacional'"},
    {nome:"Rio Paraná",        ext:"4.880 km", info:"Forma fronteira com Paraguai e Argentina"},
    {nome:"Rio Tocantins",     ext:"2.640 km", info:"Nasce em Goiás, deságua no Pará"},
    {nome:"Rio Negro",         ext:"1.700 km", info:"Principal afluente esquerdo do Amazonas"},
    {nome:"Rio Paraguai",      ext:"2.621 km", info:"Banha o Pantanal Mato-Grossense"}
  ];

  let currentScore = 0;
  let maxScore = 50;
  let secondsElapsed = 0;
  let timerInterval = null;

  function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }
  function pickRandom(arr, n) { return shuffle(arr).slice(0, n); }

  function formatTime(s) {
    const m = Math.floor(s / 60).toString().padStart(2, '0');
    const sec = (s % 60).toString().padStart(2, '0');
    return `${m}:${sec}`;
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => { secondsElapsed++; }, 1000);
  }

  function renderRiverQuiz() {
    const playArea = document.getElementById('play-area');
    const alvos = pickRandom(riosData, 4);
    const correto = alvos[0];

    playArea.innerHTML = `
      <p style="color:var(--color-text-secondary);font-size:0.95rem;margin:0 0 16px 0;font-weight:600;">Qual informação corresponde a este rio brasileiro?</p>
      <div style="background:linear-gradient(135deg,var(--navy),#0e4d87);border-radius:16px;
        padding:28px 16px;margin-bottom:24px;color:white;text-align:center;box-shadow:inset 0 0 20px rgba(0,0,0,0.15)">
        <div style="font-size:36px;margin-bottom:8px;color:var(--gold);"><i class="fa-solid fa-water"></i></div>
        <div style="font-size:2rem;font-weight:900;font-family:var(--font-display);color:white;letter-spacing:0.02em;">${correto.nome}</div>
        <div style="font-size:0.85rem;opacity:0.7;margin-top:4px;font-weight:700;">Extensão: ${correto.ext}</div>
      </div>
      <div id="opcoes" style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:480px;margin:0 auto 16px;"></div>
      <div id="feedback-msg" style="font-weight:700;font-size:0.95rem;min-height:24px;margin-top:12px;"></div>
    `;

    const optionsDiv = document.getElementById('opcoes');
    shuffle(alvos).forEach(r => {
      const btn = document.createElement('button');
      btn.className = 'btn-alt';
      btn.textContent = r.info;
      btn.onclick = () => {
        Array.from(optionsDiv.children).forEach(b => b.disabled = true);
        const feedbackMsg = document.getElementById('feedback-msg');
        
        if (r.nome === correto.nome) {
          btn.classList.add('correct');
          currentScore += 10;
          document.getElementById('game-score').textContent = currentScore;

          feedbackMsg.style.color = 'var(--color-success)';
          feedbackMsg.innerHTML = `✓ Correto! +10 pontos`;

          if (currentScore >= maxScore) {
            setTimeout(finalizarJogo, 1000);
          } else {
            setTimeout(renderRiverQuiz, 1000);
          }
        } else {
          btn.classList.add('wrong');
          feedbackMsg.style.color = 'var(--color-danger)';
          feedbackMsg.innerHTML = `✗ Incorreto! A resposta correta era do <strong>${correto.nome}</strong>`;
          
          setTimeout(renderRiverQuiz, 1400);
        }
      };
      optionsDiv.appendChild(btn);
    });
  }

  function finalizarJogo() {
    clearInterval(timerInterval);
    const playArea = document.getElementById('play-area');
    const tempo = formatTime(secondsElapsed);
    const pct = Math.min(100, Math.round((currentScore / maxScore) * 100));
    
    let estrelas = '';
    if (pct >= 85) estrelas = '<i class="fa-solid fa-star" style="color:var(--gold);"></i><i class="fa-solid fa-star" style="color:var(--gold);"></i><i class="fa-solid fa-star" style="color:var(--gold);"></i>';
    else if (pct >= 50) estrelas = '<i class="fa-solid fa-star" style="color:var(--gold);"></i><i class="fa-solid fa-star" style="color:var(--gold);"></i>';
    else estrelas = '<i class="fa-solid fa-star" style="color:var(--gold);"></i>';

    playArea.innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;gap:20px;padding:12px 0;">
        <div style="font-size:2.8rem;display:flex;gap:6px;">${estrelas}</div>
        <h2 style="color:var(--navy);font-family:var(--font-display);font-size:1.8rem;font-weight:900;margin:0;">Desafio Concluído!</h2>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:340px;margin-bottom:12px;">
          <div style="background:var(--color-bg);border:1px solid var(--color-border);border-radius:12px;padding:16px;text-align:center;">
            <div style="font-size:2rem;font-weight:900;color:var(--color-success)">${currentScore}</div>
            <div style="font-size:0.65rem;color:var(--color-text-muted);font-weight:700;text-transform:uppercase;letter-spacing:0.05em">Pontos</div>
          </div>
          <div style="background:var(--color-bg);border:1px solid var(--color-border);border-radius:12px;padding:16px;text-align:center;">
            <div style="font-size:2rem;font-weight:900;color:var(--navy)">${tempo}</div>
            <div style="font-size:0.65rem;color:var(--color-text-muted);font-weight:700;text-transform:uppercase;letter-spacing:0.05em">Tempo</div>
          </div>
        </div>
        <a href="jogos.html" class="btn btn-primary" style="padding:12px 32px;border-radius:100px;text-decoration:none;font-weight:700;display:inline-flex;align-items:center;gap:8px;">
          <i class="fa-solid fa-house"></i> Voltar ao Menu
        </a>
      </div>
    `;

    salvarResultado(currentScore, tempo, pct);
  }

  function salvarResultado(pontos, tempo, pct) {
    try {
      const hist = JSON.parse(localStorage.getItem('geoeduca_results') || '[]');
      const geoUser = JSON.parse(localStorage.getItem('geoeduca_user') || '{}');
      const nome = geoUser.name || localStorage.getItem('geoeduca_user_name') || 'Aluno';
      const sala = geoUser.sala || '';
      
      hist.push({
        gameId: 6,
        aluno: nome,
        sala: sala,
        pontuacao: pontos,
        tempo: tempo,
        data: new Date().toISOString(),
        pct: pct
      });
      localStorage.setItem('geoeduca_results', JSON.stringify(hist));
    } catch(e) {
      console.error(e);
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    const appLayout = document.getElementById('app-layout');
    if (appLayout && typeof buildAlunoSidebar === 'function') {
      appLayout.insertAdjacentHTML('afterbegin', buildAlunoSidebar('../'));
    }
    initPage('aluno');
    startTimer();
    renderRiverQuiz();
  });
</script>

</body>
</html>
