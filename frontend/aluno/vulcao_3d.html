<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vulcão 3D Interativo — GeoEduca</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/sidebar.css" />
  <link rel="stylesheet" href="../css/darkmode.css" />

  <style>
    /* CSS da integração */
    body, html {
      overflow-x: hidden;
    }

    .volcano-header {
      padding: 2rem 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .v-tag {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.28em;
      color: var(--primary); /* using geoeduca primary or the orange */
      color: #ff6b2c;
    }

    .v-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3.5rem, 8vw, 4.5rem);
      text-transform: uppercase;
      line-height: 0.9;
      margin-top: 1rem;
      margin-bottom: 1rem;
    }
    .v-title span {
      color: #ff6b2c;
    }

    .v-desc {
      max-width: 42rem;
      color: var(--color-text-secondary);
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .v-canvas-wrapper {
      position: relative;
      height: 70vh;
      min-height: 520px;
      border-radius: 1.5rem;
      border: 1px solid var(--color-border);
      background: #0d0a0b;
      overflow: hidden;
      margin: 0 1.5rem;
      max-width: 1200px;
    }
    @media(min-width: 1248px){
      .v-canvas-wrapper { margin: 0 auto; }
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      display: block;
    }

    .v-controls-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      pointer-events: none;
    }

    .v-cam-group {
      pointer-events: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      background: rgba(28, 23, 20, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid #2f2722;
      border-radius: 9999px;
      padding: 0.375rem;
    }

    .v-cam-btn {
      background: transparent;
      border: none;
      color: #a89f94;
      font-family: 'Barlow', sans-serif;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .v-cam-btn:hover {
      color: #f4efe9;
    }
    .v-cam-btn.active {
      background: #ff6b2c;
      color: #0d0a0b;
    }

    .v-erupt-btn {
      pointer-events: auto;
      background: rgba(28, 23, 20, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid #2f2722;
      color: #f4efe9;
      font-family: 'Barlow', sans-serif;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .v-erupt-btn:hover {
      background: #2a211d;
    }

    .v-hint-text {
      position: absolute;
      right: 1.25rem;
      top: 1rem;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #a89f94;
      pointer-events: none;
    }

    .v-grid-status {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1px;
      border: 1px solid var(--color-border);
      border-radius: 1rem;
      overflow: hidden;
      background: var(--color-border);
      margin: 1rem 1.5rem 0 1.5rem;
      max-width: 1200px;
    }
    @media(min-width: 640px) {
      .v-grid-status { grid-template-columns: repeat(3, 1fr); }
    }
    @media(min-width: 1248px){
      .v-grid-status { margin-left: auto; margin-right: auto; }
    }

    .v-status-item {
      background: var(--color-surface);
      padding: 1rem 1.25rem;
    }
    .v-status-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--color-text-muted);
      display: block;
      margin-bottom: 0.25rem;
    }
    .v-status-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      text-transform: uppercase;
      color: var(--color-text);
    }

    .v-anatomy-section {
      padding: 5rem 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .v-anatomy-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.5rem, 5vw, 3rem);
      text-transform: uppercase;
      margin-top: 0.75rem;
    }

    .v-anatomy-grid {
      display: grid;
      gap: 1rem;
      margin-top: 2rem;
      grid-template-columns: 1fr;
    }
    @media(min-width: 640px) { .v-anatomy-grid { grid-template-columns: repeat(2, 1fr); } }
    @media(min-width: 1024px){ .v-anatomy-grid { grid-template-columns: repeat(3, 1fr); } }

    .v-anatomy-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 1rem;
      padding: 1.5rem;
      transition: border-color 0.2s;
    }
    .v-anatomy-card:hover {
      border-color: #ff6b2c;
    }
    .v-anatomy-card-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.875rem;
      letter-spacing: 0.2em;
      color: #ff6b2c;
    }
    .v-anatomy-card-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      text-transform: uppercase;
      margin-top: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .v-anatomy-card-desc {
      font-size: 0.875rem;
      line-height: 1.6;
      color: var(--color-text-secondary);
    }

    .v-loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0a0b;
      color: #a89f94;
      z-index: 10;
      font-family: 'Barlow', sans-serif;
      transition: opacity 0.5s;
    }

  </style>
</head>
<body>

<!-- Mobile Blocker Overlay -->
<div id="mobile-blocker" style="display: none; height: 100vh; width: 100vw; position: fixed; top: 0; left: 0; background: var(--color-bg); z-index: 99999; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem;">
  <i class="fa-solid fa-desktop" style="font-size: 3rem; color: #cca43b; margin-bottom: 1rem;"></i>
  <h2 style="font-family: var(--font-display); color: var(--color-text-primary); font-size: 2.5rem; text-transform: uppercase;">Acesso Restrito</h2>
  <p style="color: var(--color-text-muted); max-width: 320px; margin-top: 1rem; font-size: 1.1rem;">
    O laboratório do Vulcão 3D requer processamento gráfico avançado e no momento foi otimizado apenas para computadores.
  </p>
  <a href="painel.html" style="margin-top: 2rem; padding: 0.75rem 2rem; background: #cca43b; color: #1a2332; border-radius: 9999px; font-weight: bold; font-family: var(--font-display); font-size: 1.25rem; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none; transition: transform 0.2s;">Voltar ao Painel</a>
</div>

<script>
  if (window.innerWidth < 1024) { // Blocks tablets and phones
    document.getElementById('mobile-blocker').style.display = 'flex';
  }
</script>

<div class="app-layout" id="app-layout">
  <!-- Sidebar será injetada via JS -->

  <main class="app-main volcano-page">
    
    <header class="app-header" style="background: transparent; border-bottom: none; padding-bottom: 0;">
      <div class="app-header-left">
        <button class="sidebar-toggle" id="mobile-sidebar-toggle" aria-label="Abrir menu" style="color: var(--color-text);">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
    </header>

    <div id="react-volcano-root"></div>

  </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/darkmode.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const appLayout = document.getElementById('app-layout');
    if (appLayout && typeof buildAlunoSidebar === 'function') {
      appLayout.insertAdjacentHTML('afterbegin', buildAlunoSidebar('../'));
    }
    initPage('aluno');
  });
</script>

<!-- Scripts e Estilos compilados pelo React (Micro-Frontend) -->
<link rel="stylesheet" href="../react_dist/vulcao/style.css?v=8" />
<script type="module" src="../react_dist/vulcao/app.js?v=8"></script>


</body>
</html>
