<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23cca43b%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22></circle><line x1=%222%22 y1=%2212%22 x2=%2222%22 y2=%2212%22></line><path d=%22M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z%22></path></svg>" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoEduca - Leitor de Provas</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/sidebar.css" />
  <link rel="stylesheet" href="../css/darkmode.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .upload-area {
      border: 2px dashed var(--color-border);
      border-radius: 12px;
      padding: 3rem 2rem;
      text-align: center;
      background: var(--color-surface);
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 1rem;
    }
    .upload-area:hover, .upload-area.dragover {
      border-color: var(--gold);
      background: rgba(204, 164, 59, 0.05);
    }
    .upload-icon {
      font-size: 3rem;
      color: var(--gold);
      margin-bottom: 1rem;
    }
    .result-container {
      margin-top: 2rem;
      display: none;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 1.5rem;
    }
    .result-score {
      font-size: 2.5rem;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      color: var(--gold);
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .question-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .question-item {
      padding: 1rem;
      border-radius: 8px;
      background: rgba(0,0,0,0.02);
      border-left: 4px solid var(--color-border);
    }
    .question-item.correct { border-left-color: #22c55e; }
    .question-item.incorrect { border-left-color: #ef4444; }
    .loading-state {
      display: none;
      text-align: center;
      padding: 3rem;
    }
    .spinner {
      animation: spin 1s linear infinite;
      font-size: 2rem;
      color: var(--gold);
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    .filter-bar {
      display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; align-items: center;
    }
    .filter-select {
      padding: 0.75rem 1rem; border: 1px solid var(--color-border, #e5e7eb); border-radius: 8px; 
      font-family: 'Inter', sans-serif; background: var(--color-surface); color: var(--color-text); min-width: 250px; outline: none;
    }
    .camera-container {
      display: none; flex-direction: column; align-items: center; gap: 1rem; margin-top: 1rem;
    }
    video { border-radius: 8px; width: 100%; max-width: 600px; background: #000; }
    canvas { display: none; }
  </style>
</head>
<body>
  <div class="app-layout" id="app-layout">
    <main class="app-main">
      <div class="content-wrapper">
        <header class="page-header">
          <div class="page-header-left">
            <h1 class="page-title">Leitor de Provas Físicas</h1>
            <p class="page-subtitle">Selecione a prova no filtro, tire a foto da folha do aluno e deixe a IA corrigir baseada no gabarito.</p>
          </div>
        </header>
        
        <div class="page-content">
          <!-- Filtro -->
          <div class="filter-bar">
            <select id="prova-select" class="filter-select">
              <option value="">Carregando provas...</option>
            </select>
          </div>

          <div class="card" style="max-width: 800px; margin: 0 auto;">
            <div style="text-align: center; margin-bottom: 1.5rem;">
              <button class="btn btn-outline" id="btn-camera" style="margin-right: 1rem;">
                <i class="fa-solid fa-camera"></i> Abrir Câmera
              </button>
              <button class="btn btn-outline" onclick="document.getElementById('file-input').click()">
                <i class="fa-solid fa-upload"></i> Fazer Upload de Foto
              </button>
              <input type="file" id="file-input" accept="image/*" style="display: none;" />
            </div>

            <!-- Previews e Câmera -->
            <div class="camera-container" id="camera-container">
              <video id="video" autoplay playsinline></video>
              <button class="btn btn-primary" id="btn-take-photo"><i class="fa-solid fa-camera"></i> Capturar Foto</button>
              <canvas id="canvas"></canvas>
            </div>
            
            <div id="image-preview-container" style="display: none; text-align: center; margin-top: 1rem;">
              <img id="image-preview" src="" style="max-width: 100%; max-height: 400px; border-radius: 8px; border: 1px solid var(--color-border);" />
              <p id="file-name" style="margin-top: 10px; font-weight: bold; color: var(--gold);"></p>
            </div>

            <div style="text-align: center; margin-top: 2rem;">
              <button id="btn-corrigir" class="btn btn-primary gold-glow" style="padding: 0.75rem 2rem; font-size: 1.1rem; width:100%" disabled>
                <i class="fa-solid fa-robot" style="margin-right: 8px;"></i> Escanear e Corrigir
              </button>
            </div>

            <!-- Loading State -->
            <div id="loading" class="loading-state">
              <i class="fa-solid fa-circle-notch spinner"></i>
              <h3 style="margin-top: 1rem;">A IA está lendo a prova...</h3>
              <p class="field-hint">Isso pode levar de 5 a 15 segundos dependendo da legibilidade da imagem.</p>
            </div>

            <!-- Results -->
            <div id="result-container" class="result-container">
              <div class="result-score">Nota: <span id="nota-final">0</span> / <span id="nota-maxima">10</span></div>
              <div class="question-list" id="question-list">
                <!-- Rendered via JS -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/sidebar.js"></script>

  <script>
    let currentImageBlob = null;
    let videoStream = null;

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('app-layout').insertAdjacentHTML('afterbegin', buildProfessorSidebar());
      const user = initPage('prof');
      if (!user) return;
      await carregarProvas();
      
      const fileInput = document.getElementById('file-input');
      const btnCorrigir = document.getElementById('btn-corrigir');
      const provaSelect = document.getElementById('prova-select');

      // Upload Handler
      fileInput.addEventListener('change', () => {
        if (fileInput.files.length) {
          const file = fileInput.files[0];
          currentImageBlob = file;
          showPreview(URL.createObjectURL(file), file.name);
          stopCamera();
        }
      });

      provaSelect.addEventListener('change', verificarCampos);
      btnCorrigir.addEventListener('click', enviarParaCorrecao);

      // Camera Handlers
      const btnCamera = document.getElementById('btn-camera');
      const btnTakePhoto = document.getElementById('btn-take-photo');
      
      btnCamera.addEventListener('click', startCamera);
      btnTakePhoto.addEventListener('click', takePhoto);
    });

    async function startCamera() {
      const cameraContainer = document.getElementById('camera-container');
      const video = document.getElementById('video');
      
      document.getElementById('image-preview-container').style.display = 'none';
      currentImageBlob = null;
      verificarCampos();

      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = videoStream;
        cameraContainer.style.display = 'flex';
      } catch (err) {
        alert('Não foi possível acessar a câmera: ' + err.message);
      }
    }

    function stopCamera() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
      }
      document.getElementById('camera-container').style.display = 'none';
    }

    function takePhoto() {
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      
      canvas.toBlob((blob) => {
        currentImageBlob = blob;
        // Mock a filename for the blob
        currentImageBlob.name = 'foto_camera.jpg';
        showPreview(URL.createObjectURL(blob), 'Foto da Câmera Capturada');
        stopCamera();
      }, 'image/jpeg', 0.9);
    }

    function showPreview(url, name) {
      const container = document.getElementById('image-preview-container');
      const img = document.getElementById('image-preview');
      const text = document.getElementById('file-name');
      
      img.src = url;
      text.textContent = name;
      container.style.display = 'block';
      verificarCampos();
    }

    async function carregarProvas() {
      const select = document.getElementById('prova-select');
      try {
        const provas = await api.get('/banco_provas');
        select.innerHTML = '<option value="">Filtre por uma prova física...</option>';
        provas.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.id;
          opt.textContent = p.titulo;
          select.appendChild(opt);
        });
      } catch (err) {
        select.innerHTML = '<option value="">Erro ao carregar provas físicas</option>';
      }
    }

    function verificarCampos() {
      const provaId = document.getElementById('prova-select').value;
      const btnCorrigir = document.getElementById('btn-corrigir');
      btnCorrigir.disabled = !(provaId && currentImageBlob);
    }

    async function enviarParaCorrecao() {
      const provaId = document.getElementById('prova-select').value;
      if (!provaId || !currentImageBlob) return;

      const btnCorrigir = document.getElementById('btn-corrigir');
      const loading = document.getElementById('loading');
      const resultContainer = document.getElementById('result-container');
      const questionList = document.getElementById('question-list');

      btnCorrigir.style.display = 'none';
      resultContainer.style.display = 'none';
      loading.style.display = 'block';
      questionList.innerHTML = '';

      const formData = new FormData();
      formData.append('provaId', provaId);
      formData.append('imagem', currentImageBlob, currentImageBlob.name || 'upload.jpg');

      try {
        const token = Auth.getToken();
        const response = await fetch(`${window.APP_CONFIG.API_BASE_URL}/leitor/corrigir`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          body: formData
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Erro ao processar correção');

        renderResultados(data);
      } catch (error) {
        console.error(error);
        alert('Erro ao corrigir prova: ' + error.message);
        btnCorrigir.style.display = 'inline-block';
      } finally {
        loading.style.display = 'none';
      }
    }

    function renderResultados(data) {
      const resultContainer = document.getElementById('result-container');
      const btnCorrigir = document.getElementById('btn-corrigir');
      const list = document.getElementById('question-list');

      document.getElementById('nota-final').textContent = data.notaTotal;
      document.getElementById('nota-maxima').textContent = data.notaMaxima;

      if (data.respostas && Array.isArray(data.respostas)) {
        data.respostas.forEach(r => {
          const item = document.createElement('div');
          item.className = `question-item ${r.correta ? 'correct' : 'incorrect'}`;
          item.innerHTML = `
            <div style="display:flex; justify-content: space-between; margin-bottom: 0.5rem;">
              <strong style="color:var(--color-text)">${r.questao}</strong>
              <span style="color:var(--gold); font-weight:bold;">${r.pontuacao} pts</span>
            </div>
            <div style="font-size:0.9rem; color:var(--muted-foreground)">
              <i class="fa-solid fa-reply fa-rotate-180" style="margin-right:4px;"></i> 
              Lido da imagem: <strong>${r.respostaAluno || 'Não lido/Em branco'}</strong>
            </div>
          `;
          list.appendChild(item);
        });
      }

      resultContainer.style.display = 'block';
      
      btnCorrigir.innerHTML = '<i class="fa-solid fa-redo"></i> Corrigir Outra';
      btnCorrigir.style.display = 'inline-block';
      btnCorrigir.onclick = () => {
        currentImageBlob = null;
        document.getElementById('image-preview-container').style.display = 'none';
        btnCorrigir.disabled = true;
        btnCorrigir.innerHTML = '<i class="fa-solid fa-robot" style="margin-right: 8px;"></i> Escanear e Corrigir';
        btnCorrigir.removeEventListener('click', btnCorrigir.onclick);
        btnCorrigir.addEventListener('click', enviarParaCorrecao);
        resultContainer.style.display = 'none';
      };
    }
  </script>
</body>
</html>
