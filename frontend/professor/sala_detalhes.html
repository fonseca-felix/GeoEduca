<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoEduca - Detalhes da Sala</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <!-- Core Styles -->
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/sidebar.css" />
  <link rel="stylesheet" href="../css/darkmode.css" />

  <style>
    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--bg-surface, #ffffff);
      padding: 1.5rem;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 1px solid var(--border-color, #e5e7eb);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .stat-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
    .stat-title {
      color: var(--text-muted, #6b7280);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 0.5rem;
    }
    .stat-value {
      font-size: 2.25rem;
      font-weight: 700;
      color: var(--text-primary, #111827);
      font-family: 'Space Grotesk', sans-serif;
      line-height: 1.1;
    }

    /* List Layout */
    .panel {
      background: var(--bg-surface, #ffffff);
      border-radius: 16px;
      padding: 1.5rem;
      border: 1px solid var(--border-color, #e5e7eb);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    .panel-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;
    }
    .panel-title {
      font-size: 1.125rem; font-weight: 700; color: var(--text-primary, #111827); display: flex; align-items: center; gap: 0.5rem;
    }
    .student-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 0;
      border-bottom: 1px solid var(--border-color, #e5e7eb);
    }
    .student-row:last-child { border-bottom: none; }
    
    .student-info { display: flex; align-items: center; gap: 1rem; }
    .student-avatar {
      width: 48px; height: 48px; border-radius: 12px; background: var(--bg-muted, #f3f4f6);
      display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--color-primary, #3b82f6);
      font-size: 1.25rem; font-family: 'Space Grotesk', sans-serif;
    }
    
    .metrics { display: flex; gap: 2rem; align-items: center; }
    .metric-item { text-align: center; }
    .metric-label { font-size: 0.75rem; color: var(--text-muted, #6b7280); text-transform: uppercase; font-weight: 600; letter-spacing: 0.05em; }
    .metric-value { font-weight: 700; color: var(--text-primary, #111827); font-size: 1.25rem; font-family: 'Space Grotesk', sans-serif; }
    
    .back-link {
      display: inline-flex; align-items: center; gap: 0.5rem;
      color: var(--text-muted, #6b7280); text-decoration: none; margin-bottom: 1.5rem; font-weight: 600;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--color-primary, #3b82f6); }
    
    .badge {
      font-size: 0.75rem; padding: 0.25rem 0.6rem; border-radius: 99px; font-weight: 600;
      display: inline-block; margin-left: 0.5rem;
    }
    .badge-success { background: rgba(16, 185, 129, 0.1); color: #10b981; }
    .badge-warning { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
    .badge-danger { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
    .badge-neutral { background: var(--bg-muted, #f3f4f6); color: var(--text-muted, #6b7280); }
  </style>
</head>
<body>
  <div class="app-layout" id="app-layout">
    <main class="app-main">
      <div style="margin-bottom: 1rem;">
        <a href="salas.html" class="back-link" style="margin-bottom: 0;">
          <i class="fa-solid fa-arrow-left"></i> Voltar para Salas
        </a>
      </div>
      <header class="page-header" style="flex-wrap: wrap; gap: 1rem; align-items: center;">
        <div class="page-header-left" style="flex: 1;">
          <div>
            <h1 class="page-title" id="sala-nome">Carregando...</h1>
            <p class="page-subtitle" id="sala-assunto" style="margin-top: 0.25rem;">Relatório da turma e métricas de alunos</p>
          </div>
        </div>
        
        <div class="page-header-right">
          <div style="background: var(--bg-surface, #ffffff); padding: 0.75rem 1.5rem; border-radius: 12px; border: 1px dashed var(--color-primary, #3b82f6); display: flex; align-items: center; gap: 1rem; box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.1);">
            <span style="font-size: 0.875rem; color: var(--text-muted, #6b7280); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;">Código de Convite</span>
            <strong style="font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; color: var(--color-primary, #3b82f6); letter-spacing: 4px;" id="sala-codigo">N/A</strong>
          </div>
        </div>
      </header>

      <div class="page-content">

        <div class="stats-grid">
          <div class="stat-card">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
              <div>
                <div class="stat-title">Total de Alunos</div>
                <div class="stat-value" id="stat-alunos">0</div>
              </div>
              <div style="font-size: 1.5rem; background: rgba(59, 130, 246, 0.1); color: var(--color-primary, #3b82f6); width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 12px;">
                <i class="fa-solid fa-users"></i>
              </div>
            </div>
          </div>
          <div class="stat-card">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
              <div>
                <div class="stat-title">Provas da Turma</div>
                <div class="stat-value" id="stat-provas">0</div>
              </div>
              <div style="font-size: 1.5rem; background: rgba(139, 92, 246, 0.1); color: #8b5cf6; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 12px;">
                <i class="fa-solid fa-file-contract"></i>
              </div>
            </div>
          </div>
          <div class="stat-card">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
              <div>
                <div class="stat-title">Taxa Média de Resposta</div>
                <div class="stat-value" id="stat-taxa">0%</div>
              </div>
              <div style="font-size: 1.5rem; background: rgba(16, 185, 129, 0.1); color: #10b981; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 12px;">
                <i class="fa-solid fa-chart-pie"></i>
              </div>
            </div>
          </div>
        </div>
        
        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title"><i class="fa-solid fa-list-check" style="color: var(--color-primary);"></i> Desempenho dos Alunos</h2>
          </div>
          <div class="student-list" id="student-list">
            <div style="text-align: center; padding: 3rem; color: var(--text-muted, #6b7280);">
              Carregando dados da turma...
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/sidebar.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('app-layout').insertAdjacentHTML('afterbegin', buildProfessorSidebar());
      const user = initPage('prof');
      if (!user) return;
      
      const urlParams = new URLSearchParams(window.location.search);
      const salaId = urlParams.get('id');
      if(!salaId) {
          window.location.href = 'salas.html';
          return;
      }
      
      await loadRelatorio(salaId);
    });

    async function loadRelatorio(salaId) {
        try {
            // Puxa infos da sala
            const sala = await api.get('/salas/' + salaId);
            document.getElementById('sala-nome').textContent = sala.nome;
            document.getElementById('sala-assunto').textContent = sala.assunto || 'Turma GeoEduca';
            document.getElementById('sala-codigo').textContent = sala.codigo || 'N/A';
            
            // Puxa relatorio
            const relatorio = await api.get('/salas/' + salaId + '/relatorio');
            const alunos = relatorio.alunos || [];
            
            document.getElementById('stat-alunos').textContent = alunos.length;
            
            let totalProvas = 0;
            let totalRespondidas = 0;
            
            const listEl = document.getElementById('student-list');
            if(alunos.length === 0) {
                listEl.innerHTML = '<div style="text-align:center; padding: 3rem; color: var(--text-muted);"><i class="fa-solid fa-ghost" style="font-size: 3rem; opacity: 0.2; margin-bottom: 1rem; display: block;"></i> Nenhum aluno inscrito nesta turma ainda. Compartilhe o código!</div>';
                return;
            }
            
            listEl.innerHTML = '';
            
            alunos.forEach(aluno => {
                const metricas = aluno.metricas || { total: 0, respondidas: 0 };
                totalProvas += metricas.total;
                totalRespondidas += metricas.respondidas;
                
                const initial = aluno.nome ? aluno.nome.charAt(0).toUpperCase() : '?';
                
                let badgeClass = '';
                let badgeText = '';
                if(metricas.total === 0) {
                    badgeClass = 'badge-neutral'; badgeText = 'Sem envios';
                } else if(metricas.respondidas === metricas.total) {
                    badgeClass = 'badge-success'; badgeText = 'Em dia';
                } else if(metricas.respondidas > 0) {
                    badgeClass = 'badge-warning'; badgeText = 'Parcial';
                } else {
                    badgeClass = 'badge-danger'; badgeText = 'Pendente';
                }
                
                const pct = metricas.total > 0 ? Math.round((metricas.respondidas / metricas.total) * 100) : 0;
                
                const htmlStr = '<div class="student-row"><div class="student-info"><div class="student-avatar">@@initial@@</div><div><h4 style="margin:0; font-size:1.1rem; color: var(--text-primary);">@@nome@@</h4><div style="font-size:0.875rem; color: var(--text-muted); margin-top: 0.25rem; font-weight: 500;">RM: @@rm@@ <span class="badge @@badgeClass@@">@@badgeText@@</span></div></div></div><div class="metrics"><div class="metric-item"><div class="metric-label">Provas</div><div class="metric-value">@@total@@</div></div><div class="metric-item"><div class="metric-label">Entregues</div><div class="metric-value" style="color: @@pctColor@@">@@respondidas@@</div></div></div></div>';
                
                const finalHtml = htmlStr
                  .replace('@@initial@@', initial)
                  .replace('@@nome@@', aluno.nome)
                  .replace('@@rm@@', aluno.rm)
                  .replace('@@badgeClass@@', badgeClass)
                  .replace('@@badgeText@@', badgeText)
                  .replace('@@total@@', metricas.total)
                  .replace('@@pctColor@@', pct === 100 ? '#10b981' : (pct > 0 ? '#f59e0b' : 'var(--text-primary)'))
                  .replace('@@respondidas@@', metricas.respondidas);

                listEl.innerHTML += finalHtml;
            });
            
            // Calculo dos stats globais
            if(alunos.length > 0) {
                const provasDaTurma = alunos[0] && alunos[0].metricas ? alunos[0].metricas.total : 0;
                document.getElementById('stat-provas').textContent = provasDaTurma;
                
                if (totalProvas > 0) {
                    const avgPct = Math.round((totalRespondidas / totalProvas) * 100);
                    document.getElementById('stat-taxa').textContent = avgPct + '%';
                } else {
                    document.getElementById('stat-taxa').textContent = 'N/A';
                }
            }
            
        } catch(e) {
            console.error(e);
            if(window.Toast) Toast.error('Erro ao carregar detalhes da sala');
        }
    }
  </script>
</body>
</html>
