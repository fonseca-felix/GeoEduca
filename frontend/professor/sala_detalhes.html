<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GeoEduca - Detalhes da Sala</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css">
  
  <style>
    .report-card {
      background: var(--color-surface);
      border-radius: 12px;
      padding: 1.5rem;
      border: 1px solid var(--color-border);
      margin-bottom: 1rem;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
      margin-bottom: 2rem;
    }
    .stat-box {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
    }
    .stat-box h3 { font-size: 0.875rem; color: var(--color-text-secondary); margin-bottom: 0.5rem; }
    .stat-box .value { font-size: 2rem; font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: var(--gold); }
    
    .student-list {
      margin-top: 1.5rem;
    }
    .student-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem;
      border-bottom: 1px solid var(--color-border);
    }
    .student-row:last-child { border-bottom: none; }
    
    .student-info { display: flex; align-items: center; gap: 1rem; }
    .student-avatar {
      width: 40px; height: 40px; border-radius: 50%; background: var(--color-surface-2);
      display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--gold);
    }
    
    .metrics { display: flex; gap: 2rem; align-items: center; }
    .metric-item { text-align: center; }
    .metric-label { font-size: 0.75rem; color: var(--color-text-secondary); text-transform: uppercase; }
    .metric-value { font-weight: 600; color: var(--color-text); font-size: 1.1rem; }
    
    .back-link {
      display: inline-flex; align-items: center; gap: 0.5rem;
      color: var(--color-text-secondary); text-decoration: none; margin-bottom: 1rem; font-weight: 500;
    }
    .back-link:hover { color: var(--gold); }
  </style>
</head>
<body>
  <div class="app-layout" id="app-layout">
    <main class="app-main">
      <div class="content-wrapper">
        
        <a href="salas.html" class="back-link">
          <i class="fa-solid fa-arrow-left"></i> Voltar para Salas
        </a>

        <header class="page-header" style="flex-direction: column; align-items: flex-start; gap: 1rem;">
          <div class="page-header-left">
            <h1 class="page-title" id="sala-nome">Carregando...</h1>
            <p class="page-subtitle" id="sala-assunto">Relatório da turma e métricas de alunos</p>
          </div>
          
          <div style="background: var(--color-surface-2); padding: 0.75rem 1.25rem; border-radius: 8px; border: 1px dashed var(--color-border); display: flex; align-items: center; gap: 1rem;">
            <span style="font-size: 0.875rem; color: var(--color-text-secondary); font-weight: 600;">Código de Convite:</span>
            <strong style="font-family: monospace; font-size: 1.5rem; color: var(--gold); letter-spacing: 2px;" id="sala-codigo">---</strong>
          </div>
        </header>

        <div class="stats-grid">
          <div class="stat-box">
            <h3>Total de Alunos</h3>
            <div class="value" id="stat-alunos">0</div>
          </div>
          <div class="stat-box">
            <h3>Provas/Atividades Enviadas</h3>
            <div class="value" id="stat-provas">0</div>
          </div>
          <div class="stat-box">
            <h3>Taxa Média de Resposta</h3>
            <div class="value" id="stat-taxa">0%</div>
          </div>
        </div>
        
        <div class="report-card">
          <h2 style="font-size: 1.25rem; margin-bottom: 1rem;">Desempenho dos Alunos</h2>
          <div class="student-list" id="student-list">
            <div style="text-align: center; padding: 2rem; color: var(--color-text-secondary);">
              Carregando dados da turma...
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/sidebar.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('app-layout').insertAdjacentHTML('afterbegin', buildProfessorSidebar());
      const user = initPage('prof');
      if (!user) return;
      
      const urlParams = new URLSearchParams(window.location.search);
      const salaId = urlParams.get('id');
      if(!salaId) {
          window.location.href = 'salas.html';
          return;
      }
      
      await loadRelatorio(salaId);
    });

    async function loadRelatorio(salaId) {
        try {
            // Puxa infos da sala
            const sala = await api.get(`/salas/${salaId}`);
            document.getElementById('sala-nome').textContent = sala.nome;
            document.getElementById('sala-assunto').textContent = sala.assunto || 'Turma GeoEduca';
            document.getElementById('sala-codigo').textContent = sala.codigo || 'N/A';
            
            // Puxa relatorio
            const relatorio = await api.get(`/salas/${salaId}/relatorio`);
            const alunos = relatorio.alunos || [];
            
            document.getElementById('stat-alunos').textContent = alunos.length;
            
            let totalProvas = 0;
            let totalRespondidas = 0;
            
            const listEl = document.getElementById('student-list');
            if(alunos.length === 0) {
                listEl.innerHTML = '<div style="text-align:center; padding: 2rem; color: var(--color-text-secondary);">Nenhum aluno inscrito nesta turma ainda. Compartilhe o código!</div>';
                return;
            }
            
            listEl.innerHTML = '';
            
            alunos.forEach(aluno => {
                const metricas = aluno.metricas || { total: 0, respondidas: 0 };
                totalProvas += metricas.total;
                totalRespondidas += metricas.respondidas;
                
                const initial = aluno.nome ? aluno.nome.charAt(0).toUpperCase() : '?';
                
                let statusBadge = '';
                if(metricas.total === 0) {
                    statusBadge = '<span style="font-size:0.75rem; padding: 0.2rem 0.5rem; background: var(--color-surface-2); border-radius: 4px;">Sem envios</span>';
                } else if(metricas.respondidas === metricas.total) {
                    statusBadge = '<span style="font-size:0.75rem; padding: 0.2rem 0.5rem; background: rgba(16, 185, 129, 0.1); color: #10b981; border-radius: 4px;">Em dia</span>';
                } else if(metricas.respondidas > 0) {
                    statusBadge = '<span style="font-size:0.75rem; padding: 0.2rem 0.5rem; background: rgba(245, 158, 11, 0.1); color: #f59e0b; border-radius: 4px;">Parcial</span>';
                } else {
                    statusBadge = '<span style="font-size:0.75rem; padding: 0.2rem 0.5rem; background: rgba(239, 68, 68, 0.1); color: #ef4444; border-radius: 4px;">Pendente</span>';
                }
                
                const pct = metricas.total > 0 ? Math.round((metricas.respondidas / metricas.total) * 100) : 0;
                
                // USANDO REPLACE EM VEZ DE TEMPLATE STRING PARA EVITAR BUGS DE ESCAPE NO MEU LADO
                const htmlStr = '<div class="student-row"><div class="student-info"><div class="student-avatar">@@initial@@</div><div><h4 style="margin:0; font-size:1rem;">@@nome@@</h4><div style="font-size:0.8rem; color: var(--color-text-secondary); margin-top: 0.25rem;">RM: @@rm@@ @@statusBadge@@</div></div></div><div class="metrics"><div class="metric-item"><div class="metric-label">Atividades/Provas</div><div class="metric-value">@@total@@</div></div><div class="metric-item"><div class="metric-label">Entregues</div><div class="metric-value" style="color: @@pctColor@@">@@respondidas@@</div></div></div></div>';
                
                const finalHtml = htmlStr
                  .replace('@@initial@@', initial)
                  .replace('@@nome@@', aluno.nome)
                  .replace('@@rm@@', aluno.rm)
                  .replace('@@statusBadge@@', statusBadge)
                  .replace('@@total@@', metricas.total)
                  .replace('@@pctColor@@', pct === 100 ? '#10b981' : (pct > 0 ? '#f59e0b' : 'var(--color-text)'))
                  .replace('@@respondidas@@', metricas.respondidas);

                listEl.innerHTML += finalHtml;
            });
            
            // Calculo dos stats globais
            if(alunos.length > 0) {
                // assumindo q total de provas enviadas pra turma é a média ou pegar um dos alunos
                const provasDaTurma = alunos[0]?.metricas?.total || 0;
                document.getElementById('stat-provas').textContent = provasDaTurma;
                
                if (totalProvas > 0) {
                    const avgPct = Math.round((totalRespondidas / totalProvas) * 100);
                    document.getElementById('stat-taxa').textContent = avgPct + '%';
                } else {
                    document.getElementById('stat-taxa').textContent = 'N/A';
                }
            }
            
        } catch(e) {
            console.error(e);
            Toast.error('Erro ao carregar detalhes da sala');
        }
    }
  </script>
</body>
</html>
