<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Master Admin | GeoEduca</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <link href="../css/tokens.css" rel="stylesheet" />
  <link href="../css/sidebar.css" rel="stylesheet" />
  <style>
        :root {
      --background: oklch(0.98 0.01 275);
      --foreground: oklch(0.16 0.045 275);
      --card: oklch(1 0 0);
      --primary: oklch(0.82 0.14 88);
      --primary-foreground: oklch(1 0 0);
      --secondary: oklch(0.95 0.02 273);
      --muted-foreground: oklch(0.5 0.025 265);
      --border: oklch(0 0 0 / 12%);
      --font-display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
      --font-sans: "DM Sans", ui-sans-serif, system-ui, sans-serif;
    }

    :root[data-theme="dark"] {
      --background: oklch(0.16 0.045 275);
      --foreground: oklch(0.97 0.005 260);
      --card: oklch(0.21 0.048 274);
      --primary: oklch(0.82 0.14 88);
      --primary-foreground: oklch(0.17 0.045 275);
      --secondary: oklch(0.26 0.05 273);
      --muted-foreground: oklch(0.72 0.025 265);
      --border: oklch(1 0 0 / 12%);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--background); color: var(--foreground); font-family: var(--font-sans); }
    .layout { display: flex; min-height: 100vh; }
    .main-content { flex: 1; margin-left: var(--sidebar-width, 260px); padding: 40px; transition: margin-left var(--transition-slow, 0.3s ease); }
    .sidebar.collapsed ~ .main-content { margin-left: var(--sidebar-width-collapsed, 72px); }
    @media (max-width: 900px) {
      .main-content, .sidebar.collapsed ~ .main-content { margin-left: 0; padding: 24px 16px; padding-top: 72px; }
    }
    
    h1 { font-family: var(--font-display); font-size: 2rem; margin-bottom: 24px; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; transition: transform 0.2s, border-color 0.2s; }
    .stat-card:hover { transform: translateY(-2px); border-color: var(--primary); }
    .stat-title { color: var(--muted-foreground); font-size: 0.875rem; margin-bottom: 8px; }
    .stat-value { font-family: var(--font-display); font-size: 2.25rem; font-weight: 700; color: var(--primary); }

    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .section-header h2 { font-family: var(--font-display); font-size: 1.35rem; }
    .link-btn { color: var(--primary); text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    .link-btn:hover { text-decoration: underline; }

    .escola-summary-list { display: grid; gap: 14px; }
    .escola-row { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
    .escola-row:hover { border-color: var(--primary); }
    .escola-badges { display: flex; gap: 12px; flex-wrap: wrap; }
    .badge { background: var(--secondary); border: 1px solid var(--border); padding: 6px 12px; border-radius: 999px; font-size: 0.8rem; color: var(--foreground); }
    .badge strong { color: var(--primary); font-family: var(--font-display); }
  </style>
</head>
<body>
  <div class="layout">
    <!-- Sidebar injected via JS -->
    
    <main class="main-content">
      <h1>Bem-vindo, Administrador Global</h1>
      <p style="color: var(--muted-foreground); margin-bottom: 32px;">Estatísticas gerais em tempo real de toda a plataforma GeoEduca.</p>
      
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-title">Total de Escolas</div>
          <div class="stat-value" id="stat-escolas">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">Total de Professores</div>
          <div class="stat-value" id="stat-professores">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">Total de Alunos</div>
          <div class="stat-value" id="stat-alunos">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">Turmas / Salas</div>
          <div class="stat-value" id="stat-salas">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">Total de Provas</div>
          <div class="stat-value" id="stat-provas">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">Quizzes & Atividades</div>
          <div class="stat-value" id="stat-atividades">-</div>
        </div>
      </div>

      <div class="section-header">
        <h2>Escolas Ativas na Plataforma</h2>
        <a href="escolas.html" class="link-btn">Gerenciar Escolas →</a>
      </div>
      <div class="escola-summary-list" id="dashboard-escolas">
        <p style="color: var(--muted-foreground);">Carregando escolas...</p>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/sidebar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (typeof Theme !== 'undefined' && Theme.init) Theme.init();

      const user = Auth.requireAuth('master');
      if (!user) return;

      // Inject Sidebar
      document.querySelector('.layout').insertAdjacentHTML('afterbegin', buildMasterSidebar('../'));
      if (typeof Sidebar !== 'undefined' && Sidebar.init) Sidebar.init();
      
      // Theme toggle (if sidebar handles it)
      const themeBtn = document.querySelector('[data-action="toggle-theme"]');
      if(themeBtn) themeBtn.addEventListener('click', () => Theme.toggle());
      const logoutBtn = document.querySelector('[data-action="logout"]');
      if(logoutBtn) logoutBtn.addEventListener('click', () => Auth.logout());

      // Fetch Stats & Escolas in parallel
      try {
        const [stats, escolas] = await Promise.all([
          api.get('/master/stats'),
          api.get('/master/escolas')
        ]);

        document.getElementById('stat-escolas').textContent = stats.totalEscolas ?? 0;
        document.getElementById('stat-professores').textContent = stats.totalProfessores ?? 0;
        document.getElementById('stat-alunos').textContent = stats.totalAlunos ?? 0;
        document.getElementById('stat-salas').textContent = stats.totalSalas ?? 0;
        document.getElementById('stat-provas').textContent = stats.totalProvas ?? 0;
        document.getElementById('stat-atividades').textContent = (stats.totalQuizzes || 0) + (stats.totalAtividades || 0);

        const listEl = document.getElementById('dashboard-escolas');
        if (!escolas || escolas.length === 0) {
          listEl.innerHTML = '<p style="color: var(--muted-foreground);">Nenhuma escola cadastrada.</p>';
        } else {
          listEl.innerHTML = escolas.map(e => `
            <div class="escola-row">
              <div>
                <h3 style="font-family: var(--font-display); color: var(--primary); margin-bottom: 4px;">${e.nome}</h3>
                <p style="font-size: 0.875rem; color: var(--muted-foreground);">${e.email}</p>
              </div>
              <div class="escola-badges">
                <span class="badge"><strong>${e.totalProfessores ?? 0}</strong> Prof(s)</span>
                <span class="badge"><strong>${e.totalSalas ?? 0}</strong> Turmas</span>
                <span class="badge"><strong>${e.totalAlunos ?? 0}</strong> Alunos</span>
              </div>
            </div>
          `).join('');
        }
      } catch (err) {
        console.error('Erro ao carregar estatísticas', err);
        document.getElementById('dashboard-escolas').innerHTML =
          `<p style="color: #ef4444;">Erro ao carregar dados: ${err.message || 'Falha na conexão'}</p>`;
      }
    });
  </script>
</body>
</html>
